# This is a sample build configuration for JavaScript.
# Check our guides at https://confluence.atlassian.com/x/14UWN for more examples.
# Only use spaces to indent your .yml configuration.
image: node:6.9.4

pipelines:
  default:
    - step:
       name: Test Node JS
       trigger: automatic
       script:
         - node --version

  branches:
    master:
    - step:
          name: Deploying to dev
          deployment: test
          trigger: automatic
          script:
                      # Install Google Cloud SDK
                      - export CLOUDSDK_CORE_DISABLE_PROMPTS=1
                      # Google Cloud SDK is pinned for build reliability. Bump if the SDK complains about deprecation.
                      - SDK_VERSION=127.0.0
                      - SDK_FILENAME=google-cloud-sdk-${SDK_VERSION}-linux-x86_64.tar.gz
                      - curl -O -J https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/${SDK_FILENAME}
                      - tar -zxvf ${SDK_FILENAME} --directory ${HOME}
                      - export PATH=${PATH}:${HOME}/google-cloud-sdk/bin
                      # Install Google App Engine SDK
                      - GAE_PYTHONPATH=${HOME}/google_appengine
                      - export PYTHONPATH=${PYTHONPATH}:${GAE_PYTHONPATH}
                      - python scripts/fetch_gae_sdk.py $(dirname "${GAE_PYTHONPATH}")
                      - echo "${PYTHONPATH}" && ls ${GAE_PYTHONPATH}
                      # deploy & test deployment
                      - echo "key = '${GOOGLE_API_KEY_DEV}'" > api_key.py
                      - echo ${GOOGLE_CLIENT_SECRET_DEV} > client-secret.json
                      - gcloud auth activate-service-account --key-file client-secret.json
                      - echo "Deploying Public"
                      - gcloud --quiet --verbosity=error app deploy public/app.yaml --project ${CLOUDSDK_CORE_PROJECT_DEV} --promote
                      - echo "Deploying Services"
                      - gcloud --quiet --verbosity=error app deploy services/app.yaml --project ${CLOUDSDK_CORE_PROJECT_DEV} --promote
                      - echo "Deploying Dashboard"
                      - gcloud --quiet --verbosity=error app deploy dashboard/app.yaml --project ${CLOUDSDK_CORE_PROJECT_DEV} --promote

# Check our guides at https://confluence.atlassian.com/x/14UWN for more examples.
# Only use spaces to indent your .yml configuration.
image: node:6.9.4

pipelines:
  branches:
    master:
    - parallel:
      - step:
          script:
                      # Install Google App Engine SDK
                      - curl -o /tmp/google-cloud-sdk.tar.gz https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-sdk-155.0.0-linux-x86_64.tar.gz
                      - tar -xvf /tmp/google-cloud-sdk.tar.gz -C /tmp/
                      - /tmp/google-cloud-sdk/install.sh -q
                      - source /tmp/google-cloud-sdk/path.bash.inc
      - step:
          name: Deploy Public to DEV environment
          script:
                      - echo ${GOOGLE_CLIENT_SECRET_DEV} > dev-client-secret.json
                      - gcloud auth activate-service-account --key-file dev-client-secret.json
                      - echo "Deploy"
                      - gcloud --quiet --verbosity=error app deploy public/app.yaml --project ${CLOUDSDK_CORE_PROJECT_DEV} --promote
      - step:
          name: Deploy Services to DEV environment
          script:
                      - echo ${GOOGLE_CLIENT_SECRET_DEV} > dev-client-secret.json
                      - gcloud auth activate-service-account --key-file dev-client-secret.json
                      - echo "Deploy"
                      - gcloud --quiet --verbosity=error app deploy services/app.yaml --project ${CLOUDSDK_CORE_PROJECT_DEV} --promote
      - step:
          name: Deploy Dashboard to DEV environment
          script:
                      - echo ${GOOGLE_CLIENT_SECRET_DEV} > dev-client-secret.json
                      - gcloud auth activate-service-account --key-file dev-client-secret.json
                      - echo "Deploy"
                      - gcloud --quiet --verbosity=error app deploy dashboard/app.yaml --project ${CLOUDSDK_CORE_PROJECT_DEV} --promote
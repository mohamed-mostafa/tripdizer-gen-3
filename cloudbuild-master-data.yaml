steps:
- name: gcr.io/cloud-builders/npm
  args: ['install-test', '--dev', '--unsafe-perm']
  dir: master-data
  id: 'UNIT TEST'
- name: gcr.io/cloud-builders/gcloud
  args: ['app', 'deploy', 'app.yaml', '--project', '${PROJECT_ID}', '--promote', '--stop-previous-version', '--format=yaml']
  dir: master-data
  id: 'GCLOUD DEPLOY'
- name: gcr.io/cloud-builders/npm
  args: ['set', 'server_url=${_API_TEST_SERVER_URL}']
  dir: master-data
  id: 'PREPARE API TEST'
- name: gcr.io/cloud-builders/npm
  args: ['run', 'api-test']
  dir: master-data
  id: 'API TEST'
timeout: 1800s
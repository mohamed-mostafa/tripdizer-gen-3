steps:
- name: gcr.io/cloud-builders/gcloud
  args: ['endpoinsts', 'services', 'deploy', 'api/swagger.yaml']
  dir: services
  id: 'GCLOUD DEPLOY ENDPOINT SERVICE'
- name: gcr.io/cloud-builders/gcloud
  args: ['app', 'deploy', 'app.yaml', '--project', '${PROJECT_ID}', '--promote', '--stop-previous-version', '--format=yaml']
  dir: services
  id: 'GCLOUD DEPLOY'
timeout: 1800s
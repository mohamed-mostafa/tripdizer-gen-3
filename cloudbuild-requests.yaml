steps:
- name: gcr.io/cloud-builders/gcloud
  args: ['endpoints', 'services', 'deploy', 'api/swagger.yaml']
  dir: package-options
  id: 'GCLOUD DEPLOY ENDPOINT SERVICE'
- name: gcr.io/cloud-builders/gcloud
  args: ['app', 'deploy', 'app.yaml', '--project', '${PROJECT_ID}', '--promote', '--stop-previous-version', '--format=yaml']
  dir: services
  id: 'GCLOUD DEPLOY'
- name: gcr.io/cloud-builders/npm
  args: ['set', 'server_url=${_API_TEST_SERVER_URL}']
  dir: services
  id: 'PREPARE API TEST'
- name: gcr.io/cloud-builders/npm
  args: ['run', 'api-test']
  dir: services
  id: 'API TEST'
timeout: 1800s
steps:
  - name: gcr.io/cloud-builders/docker
    args: [build, -t, gcr.io/$PROJECT_ID/trawex-adapter, .]
  - name: gcr.io/cloud-builders/docker
    args: [push, gcr.io/$PROJECT_ID/trawex-adapter]
  - name: gcr.io/cloud-builders/kubectl
    args: [run, trawex-adapter-dev, --image=gcr.io/$PROJECT_ID/trawex-adapter]

images:
  - gcr.io/$PROJECT_ID/trawex-adapter

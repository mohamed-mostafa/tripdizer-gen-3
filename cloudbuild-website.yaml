steps:
  - name: gcr.io/cloud-builders/gcloud
    args: ["app", "deploy", "dispatch.yaml", "--project", "${PROJECT_ID}"]
    dir: website
    id: "GCLOUD DEPLOY DISPATCHER"
  - name: gcr.io/cloud-builders/npm:node-10.10.0
    args: ["run", "build-stg"]
    dir: website
    id: "BUILD"
  - name: gcr.io/cloud-builders/gcloud
    args:
      [
        "app",
        "deploy",
        "app.yaml",
        "--project",
        "${PROJECT_ID}",
        "--promote",
        "--stop-previous-version",
        "--format=yaml",
      ]
    dir: website
    id: "GCLOUD DEPLOY"
timeout: 1800s

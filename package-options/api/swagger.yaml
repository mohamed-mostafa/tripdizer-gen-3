---
swagger: "2.0"
info:
  description: "API for listing options for the clients to create their own packages"
  version: "1.0.0"
  title: "Tripdizer package options API"
  contact:
    email: "mohamed@tripdizer.com"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
host: "package-options-dot-tripdizer-dev.appspot.com"
basePath: "/package-options-api/1.0.0"
schemes:
- "https"
paths:
  /cities:
    post:
      summary: "retrieve options of cities for a package"
      description: "retrieve the recommended options of cities in the countries choosen\
        \ by the client, based on the client's interests\n"
      operationId: "searchCities"
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: false
        type: "string"
        default: "en"
      - name: "countries"
        in: "formData"
        description: "The list of countries IATA codes chosen by the client"
        required: true
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      - name: "interests"
        in: "formData"
        description: "The list of interests chosen by the client"
        required: true
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            type: "object"
            properties:
              cities:
                type: "array"
                items:
                  $ref: "#/definitions/city"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /transportation:
    post:
      summary: "retrieve options of transportation between cities and countries for\
        \ a package"
      description: "Retrieve the recommended transportation options (flights or others)\
        \ for a package, between the cities choosen by the client. If multiple cities\
        \ are provided, the days between the departure and return will be distributed\
        \ evenly among them\n"
      operationId: "searchTransportation"
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: false
        type: "string"
        default: "en"
      - name: "departure"
        in: "formData"
        required: true
        type: "string"
        format: "date"
      - name: "return"
        in: "formData"
        required: false
        type: "string"
        format: "date"
      - name: "citiesSequence"
        in: "formData"
        required: true
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      - name: "numberOfAdults"
        in: "formData"
        required: true
        type: "number"
        default: 1.0
        minimum: 1
      - name: "numberOfChildren"
        in: "formData"
        required: false
        type: "number"
        default: 0.0
        minimum: 0
      - name: "numberOfInfants"
        in: "formData"
        required: false
        type: "number"
        default: 0.0
        minimum: 0
      responses:
        200:
          description: "search results matching criteria"
          schema:
            type: "object"
            properties:
              transportationLegs:
                type: "array"
                items:
                  $ref: "#/definitions/transportationLeg"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /accomodation:
    post:
      summary: "retrieve options of accomodations for a package"
      description: "By passing in the appropriate options, you can search for\navailable\
        \ hotels in the system\n"
      operationId: "searchAccomodations"
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: false
        type: "string"
        default: "en"
      - name: "cities"
        in: "formData"
        description: "the client's chosen cities"
        required: true
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      - name: "budgetCategory"
        in: "formData"
        description: "the client's chosen budget category"
        required: true
        type: "string"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            type: "object"
            properties:
              accomodationOffers:
                type: "array"
                items:
                  $ref: "#/definitions/accomodationOffer"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /activities:
    post:
      summary: "retrieve options of activities of a city for a package"
      description: "By passing in the appropriate options, you can search for\navailable\
        \ activities in the system\n"
      operationId: "activitiesSearchActivities"
      consumes:
      - "application/x-www-form-urlencoded"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: false
        type: "string"
        default: "en"
      - name: "cities"
        in: "formData"
        description: "the client's choosen cities"
        required: false
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            type: "object"
            properties:
              activityOffers:
                type: "array"
                items:
                  $ref: "#/definitions/activityOffer"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"

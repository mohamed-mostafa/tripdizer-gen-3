---
swagger: "2.0"
info:
  description: "API for listing options for the clients to create their own packages"
  version: "1.0.0"
  title: "Tripdizer package options API"
  contact:
    email: "mohamed@tripdizer.com"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
# host: "localhost:8084"
host: "tripdizer-package-options-dot-tripdizer-dev.appspot.com"
basePath: "/package-options/1.0.0"
schemes:
- "https"
# - "http"
paths:
  /cityOptions/search:
    post:
      summary: "retrieve options of cities for a package"
      description: "retrieve the recommended options of cities in the countries choosen\
        \ by the client, based on the client's interests"
      operationId: "searchCities"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: true
        type: "string"
        default: "en"
      - in: "body"
        name: "citiesSearchRequest"
        required: true
        schema:
          $ref: "#/definitions/citiesSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/citiesList"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /transportationOfferOptions/search:
    post:
      summary: "retrieve options of transportation between cities and countries for\
        \ a package"
      description: "Retrieve the recommended transportation options (flights or others)\
        \ for a package, between the cities choosen by the client."
      operationId: "searchTransportation"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: true
        type: "string"
        default: "en"
      - in: "body"
        name: "transportationSearchRequest"
        required: true
        schema:
          $ref: "#/definitions/transportationSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/transportationLegOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /accomodationOfferOptions/search:
    post:
      summary: "retrieve options of accomodations for a package"
      description: "By passing in the appropriate options, you can search for available\
        \ hotels in the system"
      operationId: "searchAccomodations"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: true
        type: "string"
        default: "en"
      - in: "body"
        name: "accomomdationSearchRequest"
        required: true
        schema:
          $ref: "#/definitions/accomomdationSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/accomodationOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /activitiesOfferOptions/search:
    post:
      summary: "retrieve options of activities of a city for a package"
      description: "By passing in the appropriate options, you can search for\navailable\
        \ activities in the system\n"
      operationId: "activitiesSearchActivities"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: true
        type: "string"
        default: "en"
      - in: "body"
        name: "activitiesSearchRequest"
        description: "the client's choosen cities IATA codes"
        required: true
        schema:
          $ref: "#/definitions/activitiesSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/activityOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
definitions:
  city:
    type: "object"
    properties:
      name:
        type: "string"
        example: "Cairo"
        description: "The english name of the city"
      displayName:
        type: "string"
        example: "ألقاهرة"
        description: "The localized name of the city, based on the language input"
      iataCode:
        type: "string"
        example: "CAI"
        description: "The IATA code of the city"
      country:
        type: "string"
        example: "Egypt"
        description: "The english name of the country"
      countryDisplayName:
        type: "string"
        example: "مصر"
        description: "The localized name of the country, based on the language input"
      countryIsoCode:
        type: "string"
        example: "EGY"
        description: "The ISO code of the country"
      coordinates:
        type: "string"
        example: "30.06263, 31.24967"
        description: "The coordinates of the city"
      thumbnail:
        type: "string"
        format: "url"
        example: "https://static.tripdizer.com/cairo.png"
        description: "The URL of a photo of the city"
      interests:
        type: "array"
        description: "A list of the interests (things to do) in the city"
        items:
          $ref: "#/definitions/city_interests"
  transportationLeg:
    type: "object"
    properties:
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      departure:
        type: "string"
        format: "date"
        example: "2019-10-10"
      flightOffers:
        type: "array"
        items:
          $ref: "#/definitions/flightOffer"
  flightOffer:
    type: "object"
    properties:
      flightLegs:
        type: "array"
        description: "a list of flights from an origin to a destination. if there's\
          \ only one leg, then its a one-way flight, if its two legs, then its a return\
          \ flight, if its more than 2 legs, then its a multi-city flight"
        items:
          $ref: "#/definitions/flightLeg"
      price:
        type: "number"
        format: "currency"
        example: 4500
      currency:
        type: "string"
        example: "EGP"
    description: "represents an offer to the client"
  flightLeg:
    type: "object"
    properties:
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      segments:
        type: "array"
        description: "represents one segment in a flight leg. if there's only one,\
          \ then it is a direct flight leg"
        items:
          $ref: "#/definitions/flightSegment"
      totalDurationInWords:
        type: "string"
        example: "0D6H30M"
      transitDurationInWords:
        type: "string"
        example: "0D2H0M"
      totalDurationInMinutes:
        type: "number"
        example: 240
      transitDurationInMinutes:
        type: "number"
        example: 120
      carrier:
        $ref: "#/definitions/carrier"
    description: "represents a trip from an origin to a destination. can be a direct\
      \ flight or a flight with transits."
  flightSegment:
    type: "object"
    properties:
      departure:
        type: "string"
        format: "date-time"
        example: "2016-08-29T10:00:00"
      arrival:
        type: "string"
        format: "date-time"
        example: "2016-08-29T10:00:00"
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      durationInWords:
        type: "string"
        example: "0D6H30M"
      durationInMinutes:
        type: "number"
        example: 120
  accomodationOffer:
    type: "object"
    properties:
      city:
        $ref: "#/definitions/city"
      checkin:
        type: "string"
        format: "date"
        example: "2019-06-03"
      checkout:
        type: "string"
        format: "date'"
        example: "2019-06-03"
      numberOfNights:
        type: "number"
        example: 2
        minimum: 1
      rate:
        type: "number"
        format: "currency"
        example: 1000
      currency:
        type: "string"
        example: "EGP"
      price:
        type: "number"
        format: "currency"
        example: 2000
      hotel:
        $ref: "#/definitions/hotel"
  hotel:
    type: "object"
    properties:
      name:
        type: "string"
        example: "Hilton Capetown Hotel"
      displaName:
        type: "string"
        example: "هيلتون كيب تاون"
      description:
        type: "string"
        example: "One of the best hotels in Cape Town"
      thumbnail:
        type: "string"
        format: "url"
        example: "https://static.tripdizer.com/hilton-capetown-hotel.png"
      stars:
        type: "number"
        example: 5
  activityOffer:
    properties:
      date:
        type: "string"
        format: "date"
        example: "2019-06-03"
      activity:
        $ref: "#/definitions/activity"
  activity:
    type: "object"
    properties:
      city:
        $ref: "#/definitions/city"
      name:
        type: "string"
        example: "Spend a day in the waterboom park"
      description:
        type: "string"
        example: "One of the best water activities in Bali"
      thumbnail:
        type: "string"
        format: "url"
        example: "https://static.tripdizer.com/waterboom.png"
      category:
        type: "string"
        example: "Water activity"
  citiesList:
    type: "array"
    items:
      $ref: "#/definitions/city"
  activityOffers:
    type: "array"
    items:
      $ref: "#/definitions/activityOffer"
  transportationLegOffers:
    type: "array"
    items:
      $ref: "#/definitions/transportationLeg"
  accomodationOffers:
    type: "array"
    items:
      $ref: "#/definitions/accomodationOffer"
  city_interests:
    properties:
      name:
        type: "string"
        example: "Shopping"
        description: "The english name of the interest"
      displayName:
        type: "string"
        example: "التسوق"
        description: "The localized name of the interest, based on the language input"
  carrier:
    type: "object"
    properties:
      iataCode:
        type: "string"
        example: "MS"
        description: "The IATA code of the airline"
      name:
        type: "string"
        example: "Egypt Air"
        description: "The english name of the airline"
      displayName:
        type: "string"
        description: "The localized name of the airline based on the language input"
      squareLogo:
        type: "string"
        example: "http://www.gstatic.com/flights/airline_logos/70px/MS.png"
        description: "The square logo of the airline, which usually contains only\
          \ the logo"
      wideLogo:
        type: "string"
        example: "https://www.skyscanner.net/images/airlines/small/MS.png"
        description: "The wide logo of the airline, which usually contains the logo\
          \ and the name of the airline"
    description: "describes an airline carrier"
  citiesSearchRequest:
    required:
    - "countries"
    properties:
      countries:
        type: "array"
        example:
        - "NED"
        - "FRA"
        - "ITA"
        description: "The list of country ISO-alpha3 codes chosen by the client (e.g.\
          \ FRA, ITA, EGY, etc)"
        items:
          type: "string"
      interests:
        type: "array"
        example:
        - "SHOPPING"
        - "NIGHTLIFE"
        - "HISTORY"
        description: "The list of interest names chosen by the client"
        items:
          type: "string"
  transportationOfferOptionssearch_citiesSequence:
    required:
    - "cityIata"
    - "countryIso"
    - "numberOfNights"
    properties:
      countryIso:
        type: "string"
        description: "The ISO-alpha3 code of the city's country"
      cityIata:
        type: "string"
        description: "The IATA code of the city"
      numberOfNights:
        type: "number"
        description: "The number of nights to stay in the city"
  transportationSearchRequest:
    required:
    - "citiesSequence"
    - "departure"
    - "numberOfAdults"
    - "origin"
    properties:
      departure:
        type: "string"
        format: "date"
        example: "2019-09-10"
        description: "The departure date of the trip from the origin city. The end\
          \ date of the trip is decided using the number of nights in each city in\
          \ the trip"
      origin:
        type: "string"
        example: "CAI"
        description: "The IATA code of the city that the trip starts from and ends\
          \ at"
      citiesSequence:
        type: "array"
        example:
        - countryIso: "NED"
          cityIata: "AMS"
          numberOfNights: 3
        - countryIso: "FRA"
          cityIata: "PAR"
          numberOfNights: 7
        description: "The sequence of city IATA codes / number of night pairs of the\
          \ trip"
        items:
          $ref: "#/definitions/transportationOfferOptionssearch_citiesSequence"
      numberOfAdults:
        type: "number"
        description: "The number of adults in the trip"
        minimum: 1
      numberOfChildren:
        type: "number"
        description: "The number of children in the trip"
        minimum: 0
      numberOfInfants:
        type: "number"
        description: "The number of infants in the trip"
        minimum: 0
  accomodationOfferOptionssearch_cities:
    required:
    - "cityIata"
    - "numberOfNights"
    properties:
      cityIata:
        type: "string"
      numberOfNights:
        type: "number"
  accomomdationSearchRequest:
    required:
    - "arrival"
    - "budgetCategory"
    - "cities"
    properties:
      arrival:
        type: "string"
        format: "date"
        example: "2019-08-16"
        description: "The date of arrival to the first city in the tirp. The return\
          \ date is decided using the number of nights in each city"
      cities:
        type: "array"
        example:
        - cityIata: "AMS"
          numberOfNights: 3
        - cityIata: "FRA"
          numberOfNights: 7
        description: "The sequence of city IATA codes / number of n ights of the trip."
        items:
          $ref: "#/definitions/accomodationOfferOptionssearch_cities"
      budgetCategory:
        type: "string"
        example: "ECONOMY"
        description: "the client's chosen budget category"
  activitiesOfferOptionssearch_cities:
    required:
    - "cityIata"
    - "numberOfNights"
    properties:
      cityIata:
        type: "string"
        description: "The IATA code of the city"
      numberOfNights:
        type: "number"
        description: "The number of nights to stay in the city"
  activitiesSearchRequest:
    properties:
      cities:
        type: "array"
        example:
        - cityIata: "AMS"
          numberOfNights: 3
        - cityIata: "PAR"
          numberOfNights: 7
        description: "The sequence of city IATA codes / number of night pairs of the\
          \ trip"
        items:
          $ref: "#/definitions/activitiesOfferOptionssearch_cities"
      interests:
        type: "array"
        example:
        - "SHOPPING"
        - "NIGHTLIFE"
        - "HISTORY"
        description: "The list of interest names chosen by the client"
        items:
          type: "string"

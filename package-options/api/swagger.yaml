---
swagger: "2.0"
info:
  description: "API for listing options for the clients to create their own packages"
  version: "1.0.0"
  title: "Tripdizer package options API"
  contact:
    email: "mohamed@tripdizer.com"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
host: "package-options-dot-tripdizer-dev.appspot.com"
basePath: "/package-options-api/1.0.0"
schemes:
- "https"
paths:
  /cities:
    get:
      summary: "retrieve options of cities for a package"
      description: "retrieve the recommended options of cities in the countries choosen\
        \ by the client, based on the client's interests\n"
      operationId: "searchCities"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: false
        type: "string"
        default: "en"
      - name: "countries"
        in: "query"
        description: "The list of countries ISO codes chosen by the client (e.g. FRA,\
          \ ITA, EGY, ... etc)"
        required: true
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      - name: "interests"
        in: "query"
        description: "The list of interest names chosen by the client"
        required: true
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/citiesList"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /transportation:
    get:
      summary: "retrieve options of transportation between cities and countries for\
        \ a package"
      description: "Retrieve the recommended transportation options (flights or others)\
        \ for a package, between the cities choosen by the client. If multiple cities\
        \ are provided, the days between the departure and return will be distributed\
        \ evenly among them\n"
      operationId: "searchTransportation"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: false
        type: "string"
        default: "en"
      - name: "departure"
        in: "query"
        required: true
        type: "string"
        format: "date"
      - name: "return"
        in: "query"
        required: false
        type: "string"
        format: "date"
      - name: "citiesSequence"
        in: "query"
        required: true
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      - name: "numberOfAdults"
        in: "query"
        required: true
        type: "number"
        default: 1
        minimum: 1
      - name: "numberOfChildren"
        in: "query"
        required: false
        type: "number"
        default: 0
        minimum: 0
      - name: "numberOfInfants"
        in: "query"
        required: false
        type: "number"
        default: 0
        minimum: 0
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/transportationLegOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /accomodation:
    get:
      summary: "retrieve options of accomodations for a package"
      description: "By passing in the appropriate options, you can search for\navailable\
        \ hotels in the system\n"
      operationId: "searchAccomodations"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: false
        type: "string"
        default: "en"
      - name: "cities"
        in: "query"
        description: "the client's chosen cities"
        required: true
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      - name: "budgetCategory"
        in: "query"
        description: "the client's chosen budget category"
        required: true
        type: "string"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/accomodationOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /activities:
    get:
      summary: "retrieve options of activities of a city for a package"
      description: "By passing in the appropriate options, you can search for\navailable\
        \ activities in the system\n"
      operationId: "activitiesSearchActivities"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: false
        type: "string"
        default: "en"
      - name: "cities"
        in: "query"
        description: "the client's choosen cities"
        required: false
        type: "array"
        items:
          type: "string"
        collectionFormat: "multi"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/activityOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
definitions:
  city:
    type: "object"
    properties:
      name:
        type: "string"
        example: "Cairo"
      displayName:
        type: "string"
        example: "ألقاهرة"
      iataCode:
        type: "string"
        example: "CAI"
      country:
        type: "string"
        example: "Egypt"
      countryDisplayName:
        type: "string"
        example: "مصر"
      countryIataCode:
        type: "string"
        example: "EGY"
      coordinates:
        type: "string"
        example: "30.06263, 31.24967"
      thumbnail:
        type: "string"
        format: "url"
        example: "https://static.tripdizer.com/cairo.png"
      interests:
        type: "array"
        items:
          $ref: "#/definitions/city_interests"
  transportationLeg:
    type: "object"
    properties:
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      departure:
        type: "string"
        format: "date"
        example: "2019-10-10"
      flightOffers:
        type: "array"
        items:
          $ref: "#/definitions/flightOffer"
  flightOffer:
    type: "object"
    properties:
      flightLegs:
        type: "array"
        description: "a list of flights from an origin to a destination. if there's\
          \ only one leg, then its a one-way flight, if its two legs, then its a return\
          \ flight, if its more than 2 legs, then its a multi-city flight"
        items:
          $ref: "#/definitions/flightLeg"
      price:
        type: "number"
        format: "currency"
        example: 4500
      currency:
        type: "string"
        example: "EGP"
    description: "represents an offer to the client"
  flightLeg:
    type: "object"
    properties:
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      segments:
        type: "array"
        description: "represents one segment in a flight leg. if there's only one,\
          \ then it is a direct flight leg"
        items:
          $ref: "#/definitions/flightSegment"
      totalDurationInWords:
        type: "string"
        example: "0D6H30M"
      transitDurationInWords:
        type: "string"
        example: "0D2H0M"
      totalDurationInMinutes:
        type: "number"
        example: 240
      transitDurationInMinutes:
        type: "number"
        example: 120
      carrier:
        type: "string"
        example: "EgyptAir"
      carrierThumbnail:
        type: "string"
        format: "url"
        example: "https://static.tripdizer.comm/EgyptAir.png"
    description: "represents a trip from an origin to a destination. can be a direct\
      \ flight or a flight with transits."
  flightSegment:
    type: "object"
    properties:
      departure:
        type: "string"
        format: "date-time"
        example: "2016-08-29T10:00:00"
      arrival:
        type: "string"
        format: "date-time"
        example: "2016-08-29T10:00:00"
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      durationInWords:
        type: "string"
        example: "0D6H30M"
      durationInMinutes:
        type: "number"
        example: 120
  accomodationOffer:
    type: "object"
    properties:
      city:
        $ref: "#/definitions/city"
      checkin:
        type: "string"
        format: "date"
        example: "2019-06-03"
      checkout:
        type: "string"
        format: "date'"
        example: "2019-06-03"
      numberOfNights:
        type: "number"
        example: 2
        minimum: 1
      rate:
        type: "number"
        format: "currency"
        example: 1000
      currency:
        type: "string"
        example: "EGP"
      price:
        type: "number"
        format: "currency"
        example: 2000
      hotel:
        $ref: "#/definitions/hotel"
  hotel:
    type: "object"
    properties:
      name:
        type: "string"
        example: "Hilton Capetown Hotel"
      displaName:
        type: "string"
        example: "هيلتون كيب تاون"
      description:
        type: "string"
        example: "One of the best hotels in Cape Town"
      thumbnail:
        type: "string"
        format: "url"
        example: "https://static.tripdizer.com/hilton-capetown-hotel.png"
      stars:
        type: "number"
        example: 5
  activityOffer:
    properties:
      date:
        type: "string"
        format: "date"
        example: "2019-06-03"
      activity:
        $ref: "#/definitions/activity"
  activity:
    type: "object"
    properties:
      city:
        $ref: "#/definitions/city"
      name:
        type: "string"
        example: "Spend a day in the waterboom park"
      description:
        type: "string"
        example: "One of the best water activities in Bali"
      thumbnail:
        type: "string"
        format: "url"
        example: "https://static.tripdizer.com/waterboom.png"
      category:
        type: "string"
        example: "Water activity"
  citiesList:
    type: "array"
    items:
      $ref: "#/definitions/city"
  activityOffers:
    type: "array"
    items:
      $ref: "#/definitions/activityOffer"
  transportationLegOffers:
    type: "array"
    items:
      $ref: "#/definitions/transportationLeg"
  accomodationOffers:
    type: "array"
    items:
      $ref: "#/definitions/accomodationOffer"
  city_interests:
    properties:
      name:
        type: "string"
        example: "Shopping"
      displayName:
        type: "string"
        example: "التسوق"

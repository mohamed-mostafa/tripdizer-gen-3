runtime: nodejs
env: flex
service: tripdizer-package-options

manual_scaling:
  instances: 1
resources:
  cpu: 0.4
  memory_gb: 0.8
  disk_size_gb: 10
env_variables:
  TRAWEX_ADAPTER_ENDPOINT: http://35.242.174.95:8085/trawex-adapter/1.0.0
  MASTER_DATA_ENDPOINT: https://tripdizer-master-data-dot-tripdizer-dev.appspot.com/master-data
  MEDIA_STORAGE_BASE_URL: 'https://storage.cloud.google.com/tripdizer-dev.appspot.com'

endpoints_api_service:
  # The following values are to be replaced by information from the output of
  # 'gcloud endpoints services deploy openapi-appengine.yaml' command.
  name: tripdizer-package-options-dot-tripdizer-dev.appspot.com
  rollout_strategy: managed

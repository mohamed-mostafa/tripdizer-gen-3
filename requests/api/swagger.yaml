            description: 'The key is the id of the interest ... the value is a boolean indicating if the customer has selected this interest'
      otherInterestName:
        type: string
        description: 'The name of the custom interest, if the user has typed one in the Other box'
      visaAssistanceNeeded:
        type: string
        enum:
        - '1'
        - '0'
      tourGuideNeeded:
        type: string
        enum: 
        - '1'
        - '0'
      specialRequests:
        type: string
      channel:
        type: number
        description: 'The id of a channel lookup, as in the master data'
      travelHistory:
        type: string
        description: 'The id of the travel history lookup, as in the master data'
      referralType:
        type: number
        description: 'The id of a referral type lookup, as in the master data'
      status:
        type: number
        description: 'The id of the status lookup of the request, as in the master data'
      score:

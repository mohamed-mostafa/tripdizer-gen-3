runtime: nodejs
env: flex
service: tripdizer-requests
beta_settings:
  cloud_sql_instances: tripdizer-stg:europe-west2:master-data

manual_scaling:
  instances: 1
resources:
  cpu: 0.4
  memory_gb: 0.8
  disk_size_gb: 10
env_variables:
  MASTER_DATA_ENDPOINT: https://tripdizer-master-data-dot-tripdizer-stg.appspot.com
  MEDIA_STORAGE_BASE_URL: https://storage.cloud.google.com/tripdizer-stg.appspot.com
  DATA_BACKEND: "cloudsql"
  MYSQL_USER: "application"
  MYSQL_PASSWORD: "tripdizer"
  INSTANCE_CONNECTION_NAME: "tripdizer-stg:europe-west2:master-data"
  SECRET: "TRIPDIZER-JWT-SECRET"
  ENABLE_DAILY_STATISTICS_CRON: "FALSE"
  ENABLE_END_USER_CONFIRMATION_EMAIL: "TRUE"
  ENABLE_AGENTS_NOTIFICATION_EMAIL: "TRUE"
  ENABLE_PARTNERS_NOTIFICATION_EMAIL: "TRUE"
  ENABLE_GOOGLE_PEOPLE_CONTACT_CREATION: "TRUE"
  GOOGLE_PEOPLE_CONTACTS_ACCOUNT: "test@tripdizer.com"
  PROJECT_NAME: "tripdizer-stg"
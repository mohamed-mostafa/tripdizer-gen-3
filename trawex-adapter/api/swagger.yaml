  HotelSearchRequest:
    required:
      - "tripSegments"
      - "rooms"
    properties:
      tripSegments:
        type: "array"
        description:
          "The sequence of cities / dates of the trip, where the city of\
          \ the first segment is the first and last city in the multi-city circle"
        items:
          $ref: "#/definitions/TripSegment"
      rooms:
        type: "array"
        description: "the required rooms, occupants in each room, and their ages"
        items:
          $ref: "#/definitions/Room"
      stars:
        type: "array"
        items:
          type: "number"
        example: [3, 4]
        description: "the range of stars to filter the hotels by"
      sortColumn:
        type: "string"
        default: "price"
        description: "sorting column"
      limitPerCity:
        type: "number"
        example: 9
        description: "The number of hotels per city"
      nationality:
        type: "string"
        default: "EG"
      currency:
        type: "string"
        default: "EGP"
    example:
      tripSegments:
        - cityName: "Alexandria"
          countryName: "Egypt"
          arrivalDate: "2020-05-01"
          leavingDate: "2020-05-03"
          limit: 9
        - cityName: "Cairo"
          countryName: "Egypt"
          arrivalDate: "2020-05-04"
          leavingDate: "2020-05-06"
          limit: 8
      rooms:
        - - type: "adult"
            age: 28
          - type: "adult"
            age: 25
          - type: "child"
            age: 3
        - - type: "adult"
            age: 40
          - type: "adult"
            age: 38
        - - type: "adult"
            age: 30
      stars: [4]
      sortColumn: "price"
      limitPerCity: 9
      nationality: "EG"
      currency: "EGP"

---
swagger: "2.0"
info:
  description: "Tripdizer Trawex Adapter API"
  version: "1.0.0"
  title: "Tripdizer Trawex Adapter API"
  contact:
    email: "mohamed@tripdizer.com"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
host: "tripdizer-trawex-adapter-dot-tripdizer-stg.appspot.com"
basePath: "/trawex-adapter/1.0.0"
schemes:
  - "http"
paths:
  /flights/search/multi-city:
    post:
      summary:
        "searches multi-city flights from origin to multiple destinations on\
        \ specific dates for number of travelers"
      description: "By passing in the appropriate options, you can search for flights"
      operationId: "searchMultiCityFlights"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - in: "body"
          name: "multiCityFlightsSearchRequest"
          required: true
          schema:
            $ref: "#/definitions/MultiCityFlightsSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/FlightOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /flights/search/return:
    post:
      summary:
        "searches return flights from origin to destination on specific dates\
        \ for number of travelers"
      description: "By passing in the appropriate options, you can search for flights"
      operationId: "searchReturnFlights"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - in: "body"
          name: "returnFlightsSearchRequest"
          required: true
          schema:
            $ref: "#/definitions/ReturnFlightsSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/FlightOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /flights/search/one-way:
    post:
      summary:
        "searches one way flights from origin to destination on specific dates\
        \ for number of travelers"
      description: "By passing in the appropriate options, you can search for flights"
      operationId: "searchOneWayFlights"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - in: "body"
          name: "oneWayFlightsSearchRequest"
          required: true
          schema:
            $ref: "#/definitions/OneWayFlightsSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/FlightOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /flights/fare/details:
    get:
      summary:
        "gets the details of a flight fair, using the fareSourceCode returned\
        \ from the search"
      description:
        "By passing in the appropriate options, you can retrieve details\
        \ of a fareSourceCode returned from the search"
      operationId: "getFareDetails"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - name: "sessionId"
          in: "query"
          required: true
          type: "string"
        - name: "fareSourceCode"
          in: "query"
          required: false
          type: "string"
      responses:
        200:
          description: "Successful Execution"
        400:
          description: "bad input parameter"
        500:
          description: "Internal Server Error"
      x-swagger-router-controller: "Default"
  /flights/fare/revalidate:
    get:
      summary:
        "Revalidates a flight fair, using the fareSourceCode returned from\
        \ the search"
      description:
        "By passing in the appropriate options, you can revalidate a flight\
        \ fair using the fareSourceCode returned from the search"
      operationId: "revalidateFare"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - name: "sessionId"
          in: "query"
          required: true
          type: "string"
        - name: "fareSourceCode"
          in: "query"
          required: false
          type: "string"
      responses:
        200:
          description: "Successful Execution"
          schema:
            properties:
              requiredFieldsToBook:
                type: "array"
                example:
                  - "Passport"
                  - "Passport No"
                  - "DOB"
                  - "PassengerNationality"
                  - "PostCode"
                  - "Gender"
                  - "Email"
                  - "IssueCountry"
                  - "ExpiredOn"
                  - "Title"
                  - "ContactNumber"
                items:
                  type: "string"
        400:
          description: "bad input parameter"
        500:
          description: "Internal Server Error"
      x-swagger-router-controller: "Default"
  /flights/fare/book:
    post:
      summary:
        "Books a flight fair, using the fareSourceCode returned from the search,\
        \ and the PNR information of the travelers"
      description:
        "By passing in the appropriate options, you can book a flight fair\
        \ using the fareSourceCode returned from the search, ad the PNR information\
        \ of the travelers"
      operationId: "bookFlight"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - in: "body"
          name: "bookFlightRequest"
          required: true
          schema:
            $ref: "#/definitions/BookFlightRequest"
      responses:
        200:
          description: "Successful Execution"
          schema:
            properties:
              bookingStatus:
                type: "string"
              bookingUniqueId:
                type: "string"
              bookingTicketTimeLimit:
                type: "string"
        400:
          description: "bad input parameter"
        500:
          description: "Internal Server Error"
      x-swagger-router-controller: "Default"
  /flights/ticket/issue:
    get:
      summary: "Issues a ticket for a booking. Should only be done for Piblic or Private"
      description:
        "By passing in the appropriate options, you can issue the ticket\
        \ for a booking"
      operationId: "issueTicket"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - name: "sessionId"
          in: "query"
          required: true
          type: "string"
        - name: "bookingUniqueId"
          in: "query"
          required: false
          type: "string"
      responses:
        200:
          description: "Successful Execution"
          schema:
            properties:
              ticketUniqueId:
                type: "string"
        400:
          description: "bad input parameter"
        500:
          description: "Internal Server Error"
      x-swagger-router-controller: "Default"
  /hotels/search:
    post:
      summary: "retrieve options of hotels for a city"
      description:
        "By passing in the appropriate options, you can search for available\
        \ hotels in the system"
      operationId: "searchHotels"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - name: "HotelSearchRequest"
          in: "body"
          required: true
          schema:
            $ref: "#/definitions/HotelSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            type: "array"
            description: "List of hotel"
            items:
              $ref: "#/definitions/Hotel"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /hotels/details:
    get:
      summary: "gets the details of a hotel, using the prodcut and hotel Id returned from the search"
      description: "By passing in the appropriate options, you can retrieve details of a hotel returned from the search"
      operationId: "getHotelDetails"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - name: "sessionId"
          in: "query"
          required: true
          type: "string"
        - name: "trackingId"
          in: "query"
          required: true
          type: "string"
        - name: "productId"
          in: "query"
          required: true
          type: "string"
        - name: "hotelId"
          in: "query"
          required: true
          type: "string"
      responses:
        200:
          description: "Successful Execution"
          schema:
            $ref: "#/definitions/HotelDetails"
        400:
          description: "bad input parameter"
        500:
          description: "Internal Server Error"
      x-swagger-router-controller: "Default"
  /hotels/offers:
    post:
      summary: "get hotel offers"
      operationId: "getHotelOffers"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - name: "HotelOffersRequest"
          in: "body"
          required: true
          schema:
            type: object
            properties:
              traceId:
                type: string
              propertyId:
                type: string
              productId:
                type: string
              tokenId:
                type: string
              resultIndex:
                type: string
              sessionId:
                type: string
              trackingId:
                type: string
              hotelId:
                type: string
      responses:
        200:
          description: "Successful Execution"
          schema:
            type: "array"
            description: "List of hotel offers"
            items:
              $ref: "#/definitions/HotelOffer"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /hotels/revalidate:
    post:
      summary: "revalidate hotel offer"
      operationId: "validateHotelOffer"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - name: "HotelOfferRequest"
          in: "body"
          required: true
          schema:
            $ref: "#/definitions/HotelOfferRequest"
      responses:
        200:
          description: "Successful Execution"
          schema:
            properties:
              preBookingToken:
                type: string
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /hotels/book:
    post:
      summary: "Books a hotel, using the the PNR information of the travelers"
      description: "By passing in the appropriate options, you can book a hotel using the PNR information of the travelers"
      operationId: "bookHotel"
      consumes:
        - "application/json"
      produces:
        - "application/json"
      parameters:
        - name: "language"
          in: "header"
          required: true
          type: "string"
          default: "en"
        - name: "BookHotelRequest"
          in: "body"
          required: true
          schema:
            $ref: "#/definitions/BookHotelRequest"
      responses:
        200:
          description: "Successful Execution"
          schema:
            properties:
              bookingStatus:
                type: string
              supplierConfirmationNum:
                type: array
                items:
                  type: number
              reference:
                type: array
                items:
                  type: string
              clientReference:
                type: string
              bookingDetails:
                type: object
                properties:
                  checkOut:
                    type: object
                  checkIn:
                    type: object
                  destinationName:
                    type: string
                  latitude:
                    type: string
                  longitude:
                    type: string
                  roomCount:
                    type: object
                  address:
                    type: string
        400:
          description: "bad input parameter"
        500:
          description: "Internal Server Error"
      x-swagger-router-controller: "Default"
definitions:
  TripSegment:
    required:
      - "cityName"
      - "leavingDate"
    properties:
      cityName:
        type: "string"
        description: "The name of the city"
      cityIata:
        type: "string"
        description: "The IATA code of the city"
      countryName:
        type: "string"
        description: "The name of the country"
      countryIso:
        type: "string"
        description: "The ISO-alpha3 code of the city's country"
      arrivalDate:
        type: "string"
        format: "date"
        example: "2019-10-10"
        description: "The date of arrival to the city"
      leavingDate:
        type: "string"
        format: "date"
        example: "2019-10-10"
        description: "The date of leaving from the city"
      limit:
        type: "number"
        example: 9
        description: "The number of hotels for this city"
    example:
      cityIata: "cityIata"
      arrivalDate: "2000-01-23"
      cityName: "cityName"
      countryIso: "countryIso"
      leavingDate: "2000-01-23"
  MultiCityFlightsSearchRequest:
    required:
      - "numberOfAdults"
      - "tripSegments"
    properties:
      tripSegments:
        type: "array"
        description:
          "The sequence of cities / dates of the trip, where the city of\
          \ the first segment is the first and last city in the multi-city circle"
        items:
          $ref: "#/definitions/TripSegment"
      numberOfAdults:
        type: "number"
        example: 1
        description: "The number of adults in the trip"
        minimum: 1
      numberOfChildren:
        type: "number"
        example: 0
        description: "The number of children in the trip"
        minimum: 0
      numberOfInfants:
        type: "number"
        example: 0
        description: "The number of infants in the trip"
        minimum: 0
    example:
      numberOfInfants: 0
      numberOfChildren: 0
      tripSegments:
        - cityIata: "CAI"
          arrivalDate: "2020-05-01"
          cityName: "Cairo"
          countryIso: "EGY"
          leavingDate: "2020-05-04"
        - cityIata: "AMS"
          arrivalDate: "2000-05-04"
          cityName: "Amsterdam"
          countryIso: "NLD"
          leavingDate: "2020-05-08"
        - cityIata: "PAR"
          arrivalDate: "2000-05-08"
          cityName: "Paris"
          countryIso: "FRA"
          leavingDate: "2020-05-12"
      numberOfAdults: 1
  ReturnFlightsSearchRequest:
    required:
      - "departure"
      - "destination"
      - "numberOfAdults"
      - "origin"
      - "return"
    properties:
      origin:
        type: "string"
        example: "CAI"
        description: "The origin city iata code"
      destination:
        type: "string"
        example: "AMS"
        description: "The destination city iata code"
      departure:
        type: "string"
        format: "date"
        example: "2019-12-20"
        description: "The travel date from the origin to the destination"
      return:
        type: "string"
        format: "date"
        example: "2019-12-20"
        description: "The return date from the destination to the origin"
      numberOfAdults:
        type: "number"
        example: 1
        description: "The number of adults in the trip"
        minimum: 1
      numberOfChildren:
        type: "number"
        example: 0
        description: "The number of children in the trip"
        minimum: 0
      numberOfInfants:
        type: "number"
        example: 0
        description: "The number of infants in the trip"
        minimum: 0
    example:
      numberOfInfants: 0
      numberOfChildren: 0
      numberOfAdults: 1
      origin: "CAI"
      destination: "AMS"
      departure: "2019-12-20"
      return: "2019-12-20"
  OneWayFlightsSearchRequest:
    required:
      - "departure"
      - "destination"
      - "numberOfAdults"
      - "origin"
    properties:
      origin:
        type: "string"
        example: "CAI"
        description: "The origin city iata code"
      destination:
        type: "string"
        example: "AMS"
        description: "The destination city iata code"
      departure:
        type: "string"
        format: "date"
        example: "2019-12-20"
        description: "The travel date from the origin to the destination"
      numberOfAdults:
        type: "number"
        example: 1
        description: "The number of adults in the trip"
        minimum: 1
      numberOfChildren:
        type: "number"
        example: 0
        description: "The number of children in the trip"
        minimum: 0
      numberOfInfants:
        type: "number"
        example: 0
        description: "The number of infants in the trip"
        minimum: 0
    example:
      numberOfInfants: 0
      numberOfChildren: 0
      numberOfAdults: 1
      origin: "CAI"
      destination: "AMS"
      departure: "2019-12-20"
  FlightOffers:
    type: "array"
    description: "a list of flight offers"
    items:
      $ref: "#/definitions/FlightOffer"
  FlightOffer:
    type: "object"
    properties:
      flightLegs:
        type: "array"
        description:
          "a list of flights from an origin to a destination. if there's\
          \ only one leg, then its a one-way flight, if its two legs, then its a return\
          \ flight, if its more than 2 legs, then its a multi-city flight"
        items:
          $ref: "#/definitions/FlightLeg"
      segments:
        type: "array"
        description:
          "a list of flight segments. Will only be present if flightsLegs\
          \ don not, in case of multi-city searches"
        items:
          $ref: "#/definitions/FlightSegment"
      price:
        type: "number"
        format: "currency"
      currency:
        type: "string"
        example: "EGP"
      sessionId:
        type: "string"
        description: "the id of the session at trawex"
      fareSourceCode:
        type: "string"
        description:
          "the unique identifier of the offer at trawex. will be used to\
          \ validate and book the offer later"
      fareType:
        type: "string"
        description:
          "the type of the fare (Public, Private, LCC). It affects whether\
          \ we need to issue a ticket after booking, or if booking does it already"
      refundable:
        type: "string"
      passportMandatory:
        type: "boolean"
    description: "represents an offer to the client"
  FlightLeg:
    type: "object"
    properties:
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      segments:
        type: "array"
        description:
          "represents one segment in a flight leg. if there's only one,\
          \ then it is a direct flight leg"
        items:
          $ref: "#/definitions/FlightSegment"
      totalDurationInWords:
        type: "string"
        example: "0D6H30M"
      transitDurationInWords:
        type: "string"
        example: "0D2H0M"
      totalDurationInMinutes:
        type: "number"
        example: 240
      transitDurationInMinutes:
        type: "number"
        example: 120
      carrier:
        $ref: "#/definitions/Carrier"
    description:
      "represents a trip from an origin to a destination. can be a direct\
      \ flight or a flight with transits."
  FlightSegment:
    type: "object"
    properties:
      departure:
        type: "string"
        format: "date-time"
        example: "2016-08-29T10:00:00"
      arrival:
        type: "string"
        format: "date-time"
        example: "2016-08-29T10:00:00"
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      originDetails:
        type: "string"
        example: "Cairo International Airport"
      destinationDetails:
        type: "string"
        example: "Schiphol Airport"
      durationInWords:
        type: "string"
        example: "0D6H30M"
      durationInMinutes:
        type: "number"
        example: 120
      carrier:
        $ref: "#/definitions/Carrier"
    description: "represents a part of a flight from an origin to a destination."
  Carrier:
    type: "object"
    properties:
      iataCode:
        type: "string"
        example: "MS"
      name:
        type: "string"
        example: "Egypt Air"
    description: "describes an airline carrier"
  BookFlightRequest:
    type: "object"
    properties:
      sessionId:
        type: "string"
        description: "the id of the session at trawex"
      fareSourceCode:
        type: "string"
        description:
          "the unique identifier of the offer at trawex. will be used to\
          \ validate and book the offer later"
      fareType:
        type: "string"
        description:
          "the type of the fare (Public:normal, Private:discounted for\
          \ a consolidator, LCC:low cost carrier). It affects whether we need to issue\
          \ a ticket after booking, or if booking does it already"
      adultsPNRInfoList:
        type: "array"
        items:
          $ref: "#/definitions/PNRInfo"
      childrenPNRInfoList:
        type: "array"
        items:
          $ref: "#/definitions/PNRInfo"
      infantsPNRInfoList:
        type: "array"
        items:
          $ref: "#/definitions/PNRInfo"
    description: "Describes a request to book a flight"
    example:
      passportMandatory: true
      infantsPNRInfoList:
        - passportNumber: "A08102235"
          lastName: "Mostafa"
          gender: "M"
          dateOfBirth: "1984-02-01T00:00:00"
          ageGroup: "infant"
          title: "Mr"
          passportExpiry: "2013-02-03"
          firstName: "Mohamed"
          areaCode: "02"
          nationality: "EG"
          phone: 33378321
          passportIssueCountry: "EG"
          countryCode: "+2"
          email: "email"
        - passportNumber: "A08102235"
          lastName: "Mostafa"
          gender: "M"
          dateOfBirth: "1984-02-01T00:00:00"
          ageGroup: "infant"
          title: "Mr"
          passportExpiry: "2013-02-03"
          firstName: "Mohamed"
          areaCode: "02"
          nationality: "EG"
          phone: 33378321
          passportIssueCountry: "EG"
          countryCode: "+2"
          email: "email"
      fareSourceCode: "fareSourceCode"
      childrenPNRInfoList:
        - passportNumber: "A08102235"
          lastName: "Mostafa"
          gender: "M"
          dateOfBirth: "1984-02-01T00:00:00"
          ageGroup: "kid"
          title: "Mr"
          passportExpiry: "2013-02-03"
          firstName: "Mohamed"
          areaCode: "02"
          nationality: "EG"
          phone: 33378321
          passportIssueCountry: "EG"
          countryCode: "+2"
          email: "email"
        - passportNumber: "A08102235"
          lastName: "Mostafa"
          gender: "M"
          dateOfBirth: "1984-02-01T00:00:00"
          ageGroup: "kid"
          title: "Mr"
          passportExpiry: "2013-02-03"
          firstName: "Mohamed"
          areaCode: "02"
          nationality: "EG"
          phone: 33378321
          passportIssueCountry: "EG"
          countryCode: "+2"
          email: "email"
      adultsPNRInfoList:
        - passportNumber: "A08102235"
          lastName: "Mostafa"
          gender: "M"
          dateOfBirth: "1984-02-01T00:00:00"
          ageGroup: "adult"
          title: "Mr"
          passportExpiry: "2013-02-03"
          firstName: "Mohamed"
          areaCode: "02"
          nationality: "EG"
          phone: 33378321
          passportIssueCountry: "EG"
          countryCode: "+2"
          email: "email"
        - passportNumber: "A08102235"
          lastName: "Mostafa"
          gender: "M"
          dateOfBirth: "1984-02-01T00:00:00"
          ageGroup: "adult"
          title: "Mr"
          passportExpiry: "2013-02-03"
          firstName: "Mohamed"
          areaCode: "02"
          nationality: "EG"
          phone: 33378321
          passportIssueCountry: "EG"
          countryCode: "+2"
          email: "email"
      refundable: "refundable"
      sessionId: "sessionId"
      fareType: "fareType"
  PNRInfo:
    type: "object"
    properties:
      firstName:
        type: "string"
        example: "Mohamed"
      lastName:
        type: "string"
        example: "Mostafa"
      title:
        type: "string"
        example: "Mr"

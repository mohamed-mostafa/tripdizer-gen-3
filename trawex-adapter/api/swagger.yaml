---
swagger: "2.0"
info:
  description: "Tripdizer Trawex Adapter API"
  version: "1.0.0"
  title: "Tripdizer Trawex Adapter API"
  contact:
    email: "mohamed@tripdizer.com"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
host: "tripdizer-trawex-adapter-dot-tripdizer-dev.appspot.com"
basePath: "/trawex-adapter/1.0.0"
schemes:
- "https"
paths:
  /search/multi-city-flights:
    post:
      summary: "searches multi-city flights from origin to multiple destinations on\
        \ specific dates for number of travelers"
      description: "By passing in the appropriate options, you can search for flights"
      operationId: "searchMultiCityFlights"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: true
        type: "string"
        default: "en"
      - in: "body"
        name: "multiCityFlightsSearchRequest"
        required: true
        schema:
          $ref: "#/definitions/MultiCityFlightsSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/FlightOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /search/return-flights:
    post:
      summary: "searches return flights from origin to destination on specific dates\
        \ for number of travelers"
      description: "By passing in the appropriate options, you can search for flights"
      operationId: "searchReturnFlights"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: true
        type: "string"
        default: "en"
      - in: "body"
        name: "returnFlightsSearchRequest"
        required: true
        schema:
          $ref: "#/definitions/ReturnFlightsSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/FlightOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /search/one-way-flights:
    post:
      summary: "searches one way flights from origin to destination on specific dates\
        \ for number of travelers"
      description: "By passing in the appropriate options, you can search for flights"
      operationId: "searchOneWayFlights"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: true
        type: "string"
        default: "en"
      - in: "body"
        name: "oneWayFlightsSearchRequest"
        required: true
        schema:
          $ref: "#/definitions/OneWayFlightsSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/FlightOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
  /search/hotels:
    post:
      summary: "retrieve options of hotels for a city"
      description: "By passing in the appropriate options, you can search for available\
        \ hotels in the system"
      operationId: "searchHotels"
      consumes:
      - "application/json"
      produces:
      - "application/json"
      parameters:
      - name: "language"
        in: "header"
        required: true
        type: "string"
        default: "en"
      - in: "body"
        name: "HotelSearchRequest"
        required: true
        schema:
          $ref: "#/definitions/HotelsSearchRequest"
      responses:
        200:
          description: "search results matching criteria"
          schema:
            $ref: "#/definitions/HotelOffers"
        400:
          description: "bad input parameter"
      x-swagger-router-controller: "Default"
definitions:
  TripSegment:
    required:
    - "cityIata"
    - "cityName"
    - "countryIso"
    - "leavingDate"
    properties:
      cityName:
        type: "string"
        description: "The name of the city"
      cityIata:
        type: "string"
        description: "The IATA code of the city"
      countryIso:
        type: "string"
        description: "The ISO-alpha3 code of the city's country"
      arrivalDate:
        type: "string"
        format: "date"
        example: "2019-10-10"
        description: "The date of arrival to the city"
      leavingDate:
        type: "string"
        format: "date"
        example: "2019-10-10"
        description: "The date of leaving from the city"
    example:
      cityIata: "cityIata"
      arrivaldate: "2000-01-23"
      cityName: "cityName"
      countryIso: "countryIso"
      leavingDate: "2000-01-23"
  MultiCityFlightsSearchRequest:
    required:
    - "numberOfAdults"
    - "tripSegments"
    properties:
      tripSegments:
        type: "array"
        description: "The sequence of cities / dates of the trip, where the city of\
          \ the first segment is the first and last city in the multi-city circle"
        items:
          $ref: "#/definitions/TripSegment"
      numberOfAdults:
        type: "number"
        example: 1
        description: "The number of adults in the trip"
        minimum: 1
      numberOfChildren:
        type: "number"
        example: 0
        description: "The number of children in the trip"
        minimum: 0
      numberOfInfants:
        type: "number"
        example: 0
        description: "The number of infants in the trip"
        minimum: 0
    example:
      numberOfInfants: 0
      numberOfChildren: 0
      tripSegments:
      - cityIata: "CAI"
        arrivaldate: "2020-05-01"
        cityName: "Cairo"
        countryIso: "EGY"
        leavingDate: "2020-05-04"
      - cityIata: "AMS"
        arrivaldate: "2000-05-04"
        cityName: "Amsterdam"
        countryIso: "NLD"
        leavingDate: "2020-05-08"
      - cityIata: "PAR"
        arrivaldate: "2000-05-08"
        cityName: "Paris"
        countryIso: "FRA"
        leavingDate: "2020-05-12"
      numberOfAdults: 1
  ReturnFlightsSearchRequest:
    required:
    - "departure"
    - "destination"
    - "numberOfAdults"
    - "origin"
    - "return"
    properties:
      origin:
        type: "string"
        example: "CAI"
        description: "The origin city iata code"
      destination:
        type: "string"
        example: "AMS"
        description: "The destination city iata code"
      departure:
        type: "string"
        format: "date"
        example: "2019-12-20"
        description: "The travel date from the origin to the destination"
      return:
        type: "string"
        format: "date"
        example: "2019-12-20"
        description: "The return date from the destination to the origin"
      numberOfAdults:
        type: "number"
        example: 1
        description: "The number of adults in the trip"
        minimum: 1
      numberOfChildren:
        type: "number"
        example: 0
        description: "The number of children in the trip"
        minimum: 0
      numberOfInfants:
        type: "number"
        example: 0
        description: "The number of infants in the trip"
        minimum: 0
    example:
      numberOfInfants: 0
      numberOfChildren: 0
      numberOfAdults: 1
      origin: "CAI"
      destination: "AMS"
      departure: "2019-12-20"
      return: "2019-12-20"
  OneWayFlightsSearchRequest:
    required:
    - "departure"
    - "destination"
    - "numberOfAdults"
    - "origin"
    properties:
      origin:
        type: "string"
        example: "CAI"
        description: "The origin city iata code"
      destination:
        type: "string"
        example: "AMS"
        description: "The destination city iata code"
      departure:
        type: "string"
        format: "date"
        example: "2019-12-20"
        description: "The travel date from the origin to the destination"
      numberOfAdults:
        type: "number"
        example: 1
        description: "The number of adults in the trip"
        minimum: 1
      numberOfChildren:
        type: "number"
        example: 0
        description: "The number of children in the trip"
        minimum: 0
      numberOfInfants:
        type: "number"
        example: 0
        description: "The number of infants in the trip"
        minimum: 0
    example:
      numberOfInfants: 0
      numberOfChildren: 0
      numberOfAdults: 1
      origin: "CAI"
      destination: "AMS"
      departure: "2019-12-20"
  HotelsSearchRequest:
    required:
    - "roomRequirements"
    - "starsRequirements"
    - "tripSegment"
    properties:
      tripSegment:
        $ref: "#/definitions/TripSegment"
      starsRequirements:
        type: "string"
        example: "2-4"
        description: "the range of stars to filter the hotels by"
      roomRequirements:
        type: "array"
        description: "the required rooms, occupants in each room, and their ages"
        items:
          $ref: "#/definitions/RoomRequirements"
    example:
      roomRequirements:
      - occupantType: "adult"
        occupantAge: 20
      - occupantType: "child"
        occupantAge: 3
      tripSegment:
        cityIata: "AMS"
        arrivaldate: "2000-01-23"
        cityName: "cityName"
        countryIso: "countryIso"
        leavingDate: "2000-01-23"
      starsRequirements: "2-4"
  RoomRequirements:
    type: "object"
    properties:
      items:
        $ref: "#/definitions/RoomOccupant"
    description: "represents a requirement for a hotel room"
    example:
      items:
        occupantType: "adult | child"
        occupantAge: 20
  RoomOccupant:
    type: "object"
    properties:
      occupantType:
        type: "string"
        example: "adult | child"
      occupantAge:
        type: "number"
        example: 20
    description: "an occupant in a hotel room"
    example:
      occupantType: "adult | child"
      occupantAge: 20
  FlightOffers:
    type: "array"
    description: "a list of flight offers"
    items:
      $ref: "#/definitions/FlightOffer"
  FlightOffer:
    type: "object"
    properties:
      flightLegs:
        type: "array"
        description: "a list of flights from an origin to a destination. if there's\
          \ only one leg, then its a one-way flight, if its two legs, then its a return\
          \ flight, if its more than 2 legs, then its a multi-city flight"
        items:
          $ref: "#/definitions/FlightLeg"
      segments:
        type: "array"
        description: "a list of flight segments. Will only be present if flightsLegs\
          \ don not, in case of multi-city searches"
        items:
          $ref: "#/definitions/FlightSegment"
      price:
        type: "number"
        format: "currency"
      currency:
        type: "string"
        example: "EGP"
    description: "represents an offer to the client"
  FlightLeg:
    type: "object"
    properties:
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      segments:
        type: "array"
        description: "represents one segment in a flight leg. if there's only one,\
          \ then it is a direct flight leg"
        items:
          $ref: "#/definitions/FlightSegment"
      totalDurationInWords:
        type: "string"
        example: "0D6H30M"
      transitDurationInWords:
        type: "string"
        example: "0D2H0M"
      totalDurationInMinutes:
        type: "number"
        example: 240
      transitDurationInMinutes:
        type: "number"
        example: 120
      carrier:
        $ref: "#/definitions/Carrier"
    description: "represents a trip from an origin to a destination. can be a direct\
      \ flight or a flight with transits."
  FlightSegment:
    type: "object"
    properties:
      departure:
        type: "string"
        format: "date-time"
        example: "2016-08-29T10:00:00"
      arrival:
        type: "string"
        format: "date-time"
        example: "2016-08-29T10:00:00"
      origin:
        type: "string"
        example: "CAI"
      destination:
        type: "string"
        example: "AMS"
      originDetails:
        type: "string"
        example: "Cairo International Airport"
      destinationDetails:
        type: "string"
        example: "Schiphol Airport"
      durationInWords:
        type: "string"
        example: "0D6H30M"
      durationInMinutes:
        type: "number"
        example: 120
      carrier:
        $ref: "#/definitions/Carrier"
    description: "represents a part of a flight from an origin to a destination."
  Carrier:
    type: "object"
    properties:
      iataCode:
        type: "string"
        example: "MS"
      name:
        type: "string"
        example: "Egypt Air"
    description: "describes an airline carrier"
  HotelOffers:
    type: "array"
    description: "a list of hotel offers"
    items:
      $ref: "#/definitions/Hotel"
  Hotel:
    type: "object"
    properties:
      id:
        type: "number"
      name:
        type: "string"
        example: "Hilton Capetown Hotel"
      displaName:
        type: "string"
        example: "هيلتون كيب تاون"
      description:
        type: "string"
        example: "One of the best hotels in Cape Town"
      thumbnail:
        type: "string"
        format: "url"
        example: "https://static.tripdizer.com/hilton-capetown-hotel.png"
      address:
        type: "string"
        example: "10 Sukhumvit Str."
      stars:
        type: "number"
        example: 5
      rate:
        type: "number"
        format: "currency"
        example: 1000
      currency:
        type: "string"
        example: "EGP"
      price:
        type: "number"
        format: "currency"
        example: 2000

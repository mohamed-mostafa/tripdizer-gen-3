runtime: nodejs
env: flex
service: tripdizer-trawex-adapter

# network:
#   name: tripdizer-vpc
#   instance_tag: trawex

readiness_check:
  app_start_timeout_sec: 600

manual_scaling:
  instances: 1
resources:
  cpu: 0.4
  memory_gb: 0.8
  disk_size_gb: 10
env_variables:
  TRAWEX_BASE_ENDPOINT: https://trawex.biz/api
  TRAWEX_USERNAME: TripdizerAPITest
  TRAWEX_PASSWORD: TripdizerAPI@2019
  TRAWEX_SOURCE_IP_ADDRESS: 35.242.174.95
  TRAWEX_PROXY_ENDPOINT: "http://35.242.174.95:3128"
  TRAWEX_ENVIRONMENT: Test
  PROJECT_ID: tripdizer-stg
  FLIGHT_BOOKING_PUBSUB_SUBSCRIPTION_NAME: flight-booking-subscription # SUBSCRIPTION
  HOTEL_BOOKING_PUBSUB_SUBSCRIPTION_NAME: hotel-booking-subscription #SUBSCRIPTION
  FLIGHT_BOOKING_CONFIRMATION_PUBSUB_TOPIC_NAME: flight-booking-confirmation-topic #TOPIC
  HOTEL_BOOKING_CONFIRMATION_PUBSUB_TOPIC_NAME: hotel-booking-confirmation-topic #TOPIC
  FLIGHT_BOOKING_ERROR_PUBSUB_TOPIC_NAME: flight-booking-error-topic #TOPIC
  HOTEL_BOOKING_ERROR_PUBSUB_TOPIC_NAME: hotel-booking-error-topic #TOPIC
  ENABLE_API_LOGGING: false
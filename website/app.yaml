# [START runtime]
runtime: python27
threadsafe: yes
# service: beta
# [END runtime]

handlers:

- url: /request
  static_files: dist/website/index.html
  upload: dist/website/index.html

- url: /request/(.*)
  static_files: dist/website/index.html
  upload: dist/website/index.html

- url: /
  static_files: dist/website/index.html
  upload: dist/website/index.html

- url: /(.+)
  static_files: dist/website/\1
  upload: dist/website/(.*)

# [keep gcloud from uploading not required files for deployment]
skip_files:
- ^node_modules$
- ^app\.yaml
- ^README\..*
- \.gitignore
- ^\.git$
- ^grunt\.js
- ^src$
- ^e2e$
- \.editorconfig
- ^karma\.config\.js
- ^package\.json
- ^package-lock\.json
- ^angular\.json
- ^protractor\.conf\.js
- ^tslint\.json
- ^tsconfig\.json
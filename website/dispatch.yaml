dispatch:
  - url: 'staging-services.tripdizer.com/package-options/*'
    service: tripdizer-package-options
  - url: 'staging-services.tripdizer.com/requests/*'
    service: tripdizer-requests
  - url: 'staging-services.tripdizer.com/master-data/*'
    service: tripdizer-master-data
  - url: 'staging-dashboard.tripdizer.com/*'
    service: tripdizer-dashboard
  - url: 'staging.tripdizer.com/*'
    service: default

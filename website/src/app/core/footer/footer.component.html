<div class="row px-sm-5 py-sm-4 px-4 py-3 footer">

  <div class="col-12 col-xl-4 col-lg-6 row d-none d-lg-block">
    <a class="col-12 brand" href="/">
      <img src="../../../assets/img/logo-black.svg" width="178" height="51.68" class="d-inline-block align-top" alt="">
    </a>
    <p class="col-12 p-3 slogan">{{'core.footer.slogan' | translate}}</p>
  </div>

  <ul class="d-none d-xl-block col-xl-4 text-center menu-item">
    <li class="py-2" *ngFor="let item of menuItems">{{item}}</li>
  </ul>

  <ul class="contact-info col-12 col-xl-4 col-lg-6">
    <li class="py-2"><img src="../../../assets/img/icon-phone.svg" class="pr-3 img-fluid footer-icons" alt="">+2 0101
      907 5876</li>
    <li class="py-2"><img src="../../../assets/img/icon-email.svg" class="pr-3 img-fluid footer-icons" alt="">bookings@tripdizer.com</li>
    <li class="py-2"><img src="../../../assets/img/icon-location.svg" class="pr-3 img-fluid footer-icons" alt="">{{'core.footer.location'
      | translate}}</li>
    <li class="py-5 py-xl-2 footer-li-btn"><a href="/request" class="btn btn-dark custom-bs btn-rounded px-5">{{'core.footer.plan_trip'
        | translate}}</a></li>
  </ul>

  <div class="col-12 col-xl-4 row d-lg-none d-block">
    <a class="col-12 brand" href="/">
      <img src="../../../assets/img/logo-black.svg" width="178" height="51.68" class="d-inline-block align-top" alt="">
    </a>
    <p class="col-12 p-3 slogan">{{'core.footer.slogan' | translate}}</p>
  </div>

</div>

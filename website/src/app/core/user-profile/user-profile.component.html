<div *ngIf="user; else notUser">
	<table>
		<tr>
			<td rowspan="2">
				<img [src]="user.photoUrl" alt="" class="user-img rounded-circle" />
			</td>
			<td class="text-body text-capitalize" [ngClass]="('dir' | translate) === 'rtl' ? 'text-right' : 'text-left'">
				{{ user.name }}
			</td>
		</tr>
		<tr>
			<td
				class="small text-monospace text-muted"
				[ngClass]="('dir' | translate) === 'rtl' ? 'text-right' : 'text-left'"
			>
				<a (click)="signOut()">{{ 'core.user_profile.sign_out' | translate }}</a>
			</td>
		</tr>
	</table>
</div>
<ng-template #notUser>
	<a (click)="openLoginDialog()">{{ 'core.user_profile.sign_in' | translate }}</a>
</ng-template>

<section id="testimonials" class="py-5">

  <div class="row px-sm-2 px-lg-6">
    <div class="testimonials col-12 col-lg-8 pt-2 mt-2">

      <div class="text-center" [class.text-lg-right]="('dir' | translate) === 'rtl'"
      [class.text-lg-left]="('dir' | translate) !== 'rtl'">
        <h3 class="font-weight-bold section-title title-font">
          {{ 'home.testimonials.testimonials_title' | translate }}</h3>
        <div class="underline mb-4"></div>
      </div>

      <owl-carousel class="carousel" [style.direction]="('dir' | translate) === 'rtl' ? 'ltr' : 'ltr'" #owlElement [options]="options">
        <div *ngFor="let testimonial of testimonials" class="row mx-0 testimonial-item">
          <div class="col-12 row testimonial-info" [style.direction]="('dir' | translate) === 'rtl' ? 'rtl' : 'ltr'" [class.text-right]="('dir' | translate) === 'rtl'">
            <p><i class="fa fa-quote-left quote-icon" [class.fa-flip-horizontal]="('dir' | translate) === 'rtl'" ></i></p>
            <span class="col-12 testimonial-text" [title]="testimonial.text"
              [class.title-font]="('dir' | translate) !== 'rtl'">{{ testimonial.text }}</span>
            <div class="col-12">
              <div class="row">
                <div class="col-8 col-lg-12">
                  <h5 class="testimonial-name title-font mt-2 font-weight-bold"><span>_______</span>
                    {{ testimonial.name }}</h5>
                </div>
                <div class="col-4 d-block d-lg-none" [class.text-left]="('dir' | translate) === 'rtl'"
                  [class.text-right]="('dir' | translate) !== 'rtl'">
                  <img [src]="sanitizer.bypassSecurityTrustResourceUrl(testimonial.picture)"
                    class="small-testimonial-picture d-inline-block" [alt]="testimonial.name + '\' picture'" />
                </div>
              </div>
            </div>

          </div>
        </div>
      </owl-carousel>
    </div>
    <div class="col-12 col-lg-4 d-none d-lg-block">
      <div class="row mt-lg-4 px-lg-6 pt-lg-4">
        <div class="col-4 mb-4" *ngFor="let testimonial of testimonials;let i = index">
          <img (click)="goToSlide(i)" [src]="sanitizer.bypassSecurityTrustResourceUrl(testimonial.picture)"
            class="testimonial-picture" [class.selectedSlide]="selectedSlide === i"
            [alt]="testimonial.name + '\' picture'" />
        </div>
      </div>
    </div>
  </div>
</section>

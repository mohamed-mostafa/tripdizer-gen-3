<section id="videos" class="row text-center">
	<div class="col-12 py-2 my-2">
		<span class="mr-3 watch-videos">{{ 'home.videos.watch_videos' | translate }}</span>
		<img src="../../../assets/img/youtube.svg" width="124" height="28" class="img-fluid youtube-img" alt="" />
	</div>

	<div class="col-12 p-0 py-2 my-2">
		<c-shared-owl-carousel [options]="options" [refresh]="refreshCarousel" [newClass]="'videos-carousel'">
			<span *ngFor="let video of videos">
				<a class="owl-video" [href]="sanitizer.bypassSecurityTrustResourceUrl(video.uri)"></a>
				<div class="video-caption m-auto">
					<h3 class="text-uppercase video-name">{{ video.name }}</h3>
					<span class="video-desc">{{ video.description }}</span>
				</div>
			</span>
		</c-shared-owl-carousel>
	</div>
</section>

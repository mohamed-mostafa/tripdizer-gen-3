<div
	class="tab-pane fade text-white show active"
	id="v-tailor-made-trips"
	role="tabpanel"
	aria-labelledby="v-tailor-made-trips-tab"
>
	<img src="https://i.imgur.com/oQeP6ri.jpg" alt="" />
	<span class="title-font" [class.text-right]="('dir' | translate) === 'rtl'">
		<img
			src="../../../assets/img/tailor_made_active.svg"
			class="d-none d-sm-block mb-md-3 mb-sm-2 mb-1 nav-img"
			alt=""
		/>

</div>

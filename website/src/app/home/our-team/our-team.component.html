<section id="our-team" class="row">
	<c-shared-owl-carousel [options]="options" [refresh]="refreshCarousel" [newClass]="'our-team-carousel pt-2 mt-2'">
		<span *ngFor="let member of teamMembers" class="team-member text-center">
			<span class="img-fluid m-auto member-picture-wrapper">
				<img
					[src]="sanitizer.bypassSecurityTrustResourceUrl(member.picture)"
					class="rounded-circle img-fluid m-auto member-picture"
					[alt]="member.name + '\' picture'"
				/>
			</span>
			<div class="member-info m-auto mt-md-4 pt-md-4 mt-sm-3 pt-sm-3 mt-2 pt-2">
				<h3 class=" text-white member-name">{{ member.name }}</h3>
				<span class="member-job-title">{{ member.jobTitle }}</span>
			</div>
		</span>
	</c-shared-owl-carousel>
</section>

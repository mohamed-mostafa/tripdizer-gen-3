<c-request-form-layout [formGroup]="formGroup" (next)="save()">
  <mat-radio-group class="text form-control-xl my-1 my-sm-2 my-md-3 my-lg-4 row" formControlName="budgetCategory">
    <div class="mat-radio-group-label-wrapper text-capitalize col-12" [class.mat-error]="formGroup.controls.budget.invalid">
      <span class="mat-radio-group-label" [class.text-muted]="!isOwnBudget">{{'request.budget.budget' | translate}}</span>
      <span class="mat-radio-group-subscript">{{formGroup.controls.budget.errors | errorMessage}}</span>
    </div>
    <mat-slider min="1" max="50000" step="1000" class="col-12 col-lg-8" thumbLabel formControlName="budget"></mat-slider>
    <div class="col-12 mat-display-2 custom-bs text-yellow" [class.text-muted]="!isOwnBudget" [class.text-right]="('dir' | translate)=== 'rtl'">
      {{formGroup.controls.budget.value | currency:'EGP':('currency.EGP' | translate)+' ':'0.0-0'}}
    </div>
    <div class="col-12 text-center budget-categories">
      <mat-radio-button *ngFor="let budgetCategory of budgetCategories" [value]="budgetCategory.id" [hidden]="budgetCategory.id == 1"
        class="m-1 m-lg-2">{{budgetCategory.name}}</mat-radio-button>
    </div>
  </mat-radio-group>
</c-request-form-layout>

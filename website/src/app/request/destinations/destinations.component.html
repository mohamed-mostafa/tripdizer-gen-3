<c-request-form-layout [isButtonsHidden]="true" class="d-flex mt-2 mt-sm-3">
  <div class="destination-container text-center m-auto">
    <div *ngFor="let destination of destinations" (click)="goToNextStep(destination)" class="destination m-2 m-sm-3">
      <div class="destination-info">
        <div class="dest-temp w-50 clearfix">
          <span [ngClass]="('dir' | translate) === 'ltr' ? 'float-left' : 'float-right'">{{destination.temperatureLo}}</span>
          <span [ngClass]="('dir' | translate) === 'ltr' ? 'float-right' : 'float-left'">{{destination.temperatureHi}}</span>
        </div>
        <div class="dest-data">
          <div class="dest-data-wrapper text-uppercase">
            <div class="dest-name">{{destination.name}},</div>
            <div class="dest-desc">{{destination.description}}</div>
          </div>
        </div>
      </div>
      <img class="destination-img" [src]="destination.image" alt="">
    </div>
  </div>
</c-request-form-layout>

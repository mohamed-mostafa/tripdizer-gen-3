<c-request-form-layout [isButtonsHidden]="true">
	<div
		class="row estimated-cost tabs-section"
		[class.text-right]="('dir' | translate) === 'rtl'"
		[hidden]="selectedTab === 4"
	>
		<div class="col-12 p-0 mt-n2 mt-sm-n3">
			<c-estimated-cost-header></c-estimated-cost-header>
		</div>

		<div class="col-12">
			<hr class="d-none d-md-block" />

			<mat-tab-group mat-align-tabs="center" (selectedIndexChange)="tabChange($event)" [selectedIndex]="selectedTab">
				<mat-tab>
					<ng-template mat-tab-label>
						<div class="tab-icon title-font">
							<i class="fa fa-university mb-2 mb-md-0 mr-1 d-block d-md-inline-block"></i>
							{{ 'request.estimated_cost.tab_cities.title' | translate }}
						</div>
					</ng-template>
					<div class="row mx-0">
						<div class="col-12">
							<div class="m-2 p-md-0 mt-3 mt-md-0">
								<c-estimated-cost-cities *ngIf="selectedTab === 0 || (isCitiesTabVisited | async)"></c-estimated-cost-cities>
							</div>
						</div>
					</div>
				</mat-tab>
				<mat-tab [disabled]="selectedTab < 1">
					<ng-template mat-tab-label>
						<div class="tab-icon title-font">
							<i class="fa fa-plane mb-2 mb-md-0 mr-1 d-block d-md-inline-block"></i>
							{{ 'request.estimated_cost.tab_flights.title' | translate }}
						</div>
					</ng-template>
					<div class="row mx-0">
						<div class="col-12">
							<div class="p-2 p-md-0 mt-3 mt-md-0">
								<c-estimated-cost-flights
									*ngIf="selectedTab === 1 || (isFlightsTabVisited | async)"
								></c-estimated-cost-flights>
							</div>
						</div>
					</div>
				</mat-tab>
				<mat-tab [disabled]="selectedTab < 2">
					<ng-template mat-tab-label>
						<div class="tab-icon title-font">
							<i class="fa fa-building mb-2 mb-md-0 mr-1 d-block d-md-inline-block"></i>
							{{ 'request.estimated_cost.tab_accommodations.title' | translate }}
						</div>
					</ng-template>
					<div class="row mx-0">
						<div class="col-12">
							<div class="p-2 p-md-0 mt-3 mt-md-0">
								<c-estimated-cost-accommodation *ngIf="selectedTab === 2 || (isAccommodationTabVisited | async)"></c-estimated-cost-accommodation>
							</div>
						</div>
					</div>
				</mat-tab>
			</mat-tab-group>
		</div>
	</div>
</c-request-form-layout>

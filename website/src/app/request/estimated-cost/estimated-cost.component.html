<div class="row tabs-section" [class.text-right]="('dir' | translate) === 'rtl'">
	<div class="col-12">
		<hr class="d-none d-md-block" />

		

		<mat-tab-group mat-align-tabs="center" [selectedIndex]="selectedTab">
			<mat-tab>
				<ng-template mat-tab-label>
					<div class="tab-icon">
						<i class="fa fa-university mb-2 mb-md-0 mr-1 d-block d-md-inline-block"></i>
						{{ 'request.estimated_cost.tab_cities.title' | translate }}
					</div>
				</ng-template>
				<div class="row mx-0">
					<div class="col-12">
						<div class="m-2 p-md-0 mt-3 mt-md-0">
							<c-estimated-cost-cities></c-estimated-cost-cities>
						</div>
					</div>
				</div>
			</mat-tab>
			<mat-tab>
				<ng-template mat-tab-label>
					<div class="tab-icon">
						<i class="fa fa-plane mb-2 mb-md-0 mr-1 d-block d-md-inline-block"></i>
						{{ 'request.estimated_cost.tab_flights.title' | translate }}
					</div>
				</ng-template>
				<div class="row mx-0">
					<div class="col-12">
						<div class="p-2 p-md-0 mt-3 mt-md-0">
							<c-estimated-cost-flights></c-estimated-cost-flights>
						</div>
					</div>
				</div>
			</mat-tab>
			<mat-tab>
				<ng-template mat-tab-label>
					<div class="tab-icon">
						<i class="fa fa-building mb-2 mb-md-0 mr-1 d-block d-md-inline-block"></i>
						{{ 'request.estimated_cost.tab_accommodations.title' | translate }}
					</div>
				</ng-template>
				<div class="row mx-0">
					<div class="col-12">
						<div class="p-2 p-md-0 mt-3 mt-md-0">
							<c-estimated-cost-accommodation></c-estimated-cost-accommodation>
						</div>
					</div>
				</div>
			</mat-tab>
		</mat-tab-group>
	</div>
</div>

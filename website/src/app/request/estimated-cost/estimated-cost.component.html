<div class="row tabs-section" [class.text-right]="('dir' | translate) === 'rtl'">
  <div class="col-12">

    <hr />

    <ul class="nav nav-tabs justify-content-center" id="myTab" role="tablist">
      <li class="nav-item">
        <a class="nav-link active" style="border-right: 0" id="home-tab" data-toggle="tab" href="#home" role="tab"
          aria-controls="home" aria-selected="true">
          <div class="tab-container">
            <div class="tab-icon"><i class="fa fa-university"></i></div>
            <div class="tab-space">&nbsp;&nbsp;</div>
            <div class="tab-text">Cities</div>
          </div>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" style="border-right: 0" id="profile-tab" data-toggle="tab" href="#profile" role="tab"
          aria-controls="profile" aria-selected="false">
          <div class="tab-container">
            <div class="tab-icon"><i class="fa fa-plane"></i></div>
            <div class="tab-space">&nbsp;&nbsp;</div>
            <div class="tab-text">Flights</div>
          </div>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" id="contact-tab" data-toggle="tab" href="#contact" role="tab" aria-controls="contact"
          aria-selected="false">
          <div class="tab-container">
            <div class="tab-icon"><i class="fa fa-building"></i></div>
            <div class="tab-space">&nbsp;&nbsp;</div>
            <div class="tab-text">Accommodation</div>
          </div>
        </a>
      </li>
    </ul>
    <div class="tab-content" id="myTabContent">
      <div class="tab-pane tab-pane-cities fade show active mt-2" id="home" role="tabpanel" aria-labelledby="home-tab" >
		  <app-cities></app-cities>
	  </div>
      <div class="tab-pane fade mt-2" id="profile" role="tabpanel" aria-labelledby="profile-tab">Tab 2 content</div>
      <div class="tab-pane fade mt-2" id="contact" role="tabpanel" aria-labelledby="contact-tab">Tab 3 content</div>
    </div>
  </div>
</div>

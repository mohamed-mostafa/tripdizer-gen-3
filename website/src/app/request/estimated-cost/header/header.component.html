<div id="estimated-cost-header" class="header">
	<div class="center font-weight-bold text-center text-white">
		<div *ngIf="numberOfNights" class="m-0 h3 days">{{ numberOfNights }} Days in</div>
		<div *ngIf="selectedCountriesName" class="m-0 country">{{ selectedCountriesName }}</div>
		<div *ngIf="departureDate && returnDate" class="m-0 dates">
			From {{ departureDate | date: 'd / M / y' }} To {{ returnDate | date: 'd / M / y' }}
		</div>
	</div>
</div>

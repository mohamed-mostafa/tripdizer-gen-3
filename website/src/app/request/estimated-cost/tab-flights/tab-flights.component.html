<div class="tab-flights row m-0 m-xs-0 m-sm-1 m-md-2 m-lg-3 m-xl-5">
	<div class="col-12 col-lg-8">
		<h5 class="font-italic text-secondary view-edit">
			{{ 'request.estimated_cost.tab_flights.view_edit' | translate }}
		</h5>

		<div class="routes position-relative">
			<div
				*ngFor="
					let flight of (flights | async);
					let index = index;
					let isEven = even;
					let isFirst = first;
					let isLast = last
				"
			>
				<c-estimated-cost-flight-row
					[flight]="flight"
					[index]="index"
					[isEven]="isEven"
					[isFirst]="isFirst"
					[isLast]="isLast"
				></c-estimated-cost-flight-row>
			</div>
		</div>
	</div>
	<div class="d-none d-lg-block col-4">
		<hr class="d-lg-none" />
		<h6 class="font-weight-bold font-italic view-map">
			{{ 'request.estimated_cost.tab_cities.view_map' | translate }}
		</h6>
		<img src="../../../assets/img/map.png" alt="" />
	</div>
</div>

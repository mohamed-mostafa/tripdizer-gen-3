<div class="tab-flights row m-5">
	<div class="col-8">
		<h5 class="font-italic text-secondary view-edit">
			{{ 'request.estimated_cost.tab_flights.view_edit' | translate }}
		</h5>

		<div class="routes position-relative">
			<div
				*ngFor="
					let flight of (flights | async);
					let index = index;
					let isEven = even;
					let isFirst = first;
					let isLast = last
				"
			></div>
		</div>
	</div>
	<div class="col-4">
		<hr class="d-lg-none" />
		<h6 class="font-weight-bold font-italic view-map">
			{{ 'request.estimated_cost.tab_cities.view_map' | translate }}
		</h6>
		<img src="../../../assets/img/map.png" alt="" />
	</div>
</div>

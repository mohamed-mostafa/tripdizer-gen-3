<div *ngIf="flightOffers">
  <div class="tab-flights row m-0 m-xs-0 m-sm-1 m-md-2 m-lg-3 m-xl-5">

    <div class="col-12 col-lg-3 d-none d-lg-block">
      <c-app-flight-route [flightOffers]="flightOffers"></c-app-flight-route>
    </div>


    <div class="col-12 col-lg-6">
      <div class="flights-box">
        <div class="flights-title p-1">
          <h6 class="mt-1 ml-2">{{ 'request.estimated_cost.tab_flights.best_flights' | translate }}</h6>
        </div>

        <div class="px-4 mt-3">

          <owl-carousel *ngIf="flightOffers.length > 0" class="carousel" #owlElement [options]="options" [carouselClasses]="['row']">
            <div class="mb-2 mx-1 item flight-offer-slide" *ngFor="let offer of flightOffers">

                <div *ngFor="let flightLeg of offer.flightLegs">
                        <p>flightLeg</p>
                </div>
              
            </div>

          </owl-carousel>

          <p *ngIf="flightOffers.length < 1">
                {{ 'request.estimated_cost.tab_flights.no_flight_offers' | translate }}
          </p>

        </div>

      </div>
    </div>

    <div class="col-12 col-lg-3">
      <div *ngIf="flightPaths?.length" class="row d-lg-block">
        <div class="col-12">
          <c-shared-google-map [paths]="flightPaths"></c-shared-google-map>
        </div>
      </div>

    </div>
  </div>

  <div class="row">
    <div class="col-12 text-center">
      <a href="javascript:void(0)" (click)="back()" class="back-btn position-relative"
        [ngClass]="('dir' | translate) === 'ltr' ? 'mr-4 mr-lg-5' : 'ml-4 ml-lg-5'">{{ 'request.estimated_cost.tab_flights.back_label' | translate }}</a>

      <button (click)="next()" class="btn btn-primary custom-bs btn-rounded text-uppercase px-4 py-2">
        {{ 'request.estimated_cost.tab_flights.next_label' | translate }}
      </button>
    </div>
  </div>
</div>

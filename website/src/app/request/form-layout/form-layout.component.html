<div class="row justify-content-center align-items-center py-2 py-sm-3">
  <form [formGroup]="formGroup" [ngClass]="isButtonsHidden ? 'col-12' : 'col-11 col-lg-8'">
    <ng-content></ng-content>
  </form>
  <div *ngIf="!isButtonsHidden" class="my-4 my-lg-0">
    <a href="javascript:void(0)" (click)="goToPrevStep()" *ngIf="!isBackHidden" class="back-btn position-relative"
      [ngClass]="('dir' | translate) === 'ltr' ? 'mr-4 mr-lg-5' : 'ml-4 ml-lg-5'">{{backLabel}}</a>
    <button (click)="goToNextStep()" [disabled]="formGroup.invalid || isNextDisabled" class="btn btn-lg btn-primary custom-bs btn-rounded text-uppercase">{{nextLabel}}
      <i class="fas" [ngClass]="('dir' | translate) === 'ltr' ? 'fa-chevron-right' : 'fa-chevron-left'"></i></button>
  </div>
</div>

<div id="request-nav-bar-container" class="row request-nav-bar">
  <div class="nav-brand" [routerLink]="['/']"></div>
  <div class="nav-links col p-0">
    <div>
      <div *ngFor="let navLink of navBar;let i = index" [routerLink]="[navLink.path]" class="nav-link text-capitalize"
        [class.active]="currentPath === navLink.path" [class.disabled]="!navLink.isClickable()" [class.text-right]="('dir' | translate) === 'rtl'">
        <div class="col-12 px-2 px-md-3 title">{{navLink.title}}</div>
        <div class="col-12 px-2 px-md-3 value">{{navLink.value}}</div>
      </div>
    </div>
  </div>
  <!-- <a class="px-3 px-lg-4 px-lg-5 nav-login-link" href="#">Login <i class="fas fa-lock"></i></a> -->
</div>

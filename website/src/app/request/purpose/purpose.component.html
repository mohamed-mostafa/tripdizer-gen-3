<div class="h-100">
  <div class="row h-100 justify-content-center align-items-center">
    <form [formGroup]="formGroup" class="col-11 col-lg-7">
      <mat-radio-group class="image form-control-xl my-1 my-sm-2 my-md-3 my-lg-4 row" formControlName="purpose">
        <mat-radio-button *ngFor="let purpose of purposes" [value]="purpose.id" class="m-2">
          {{purpose.name}}
          <span class="label-content-img" [style.background]="'url(' + purpose.image + ')'"></span>
        </mat-radio-button>
      </mat-radio-group>
    </form>
    <div class="offset-lg-1">
      <a href="javascript:void(0)" (click)="goToPrevStep()" class="mr-5">Back</a>
      <button (click)="goToNextStep()" [disabled]="formGroup.invalid" class="btn btn-primary custom-bs btn-rounded btn-xl text-uppercase">Continue
        <i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
</div>

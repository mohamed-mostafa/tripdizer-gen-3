<div class="h-100 justify-content-center align-items-center d-flex mt-2 mt-sm-3">
  <div class="destination-container text-center m-auto">
    <div *ngFor="let destination of destinations;let first = first;let last = last;" (click)="goToNextStep(destination.id)"
      class="destination m-2 m-sm-3">
      <div class="destination-info">
        <div *ngIf="first || last" class="d-inline-block w-25"></div>
        <div class="dest-temp d-inline-block w-50 clearfix">
          <span class="float-left">{{destination.temperatureLo}}</span>
          <span class="float-right">{{destination.temperatureHi}}</span>
        </div>
        <div class="d-inline-block w-25 text-right" [class.w-50]="!first && !last">Rank: {{destination.rank}}%</div>
        <div class="dest-data">
          <div class="dest-data-wrapper text-uppercase">
            <div class="dest-name">{{destination.name}},</div>
            <div class="dest-desc">{{destination.description}}</div>
          </div>
          <span class="estimated-cost">{{(destination.estimatedCost) | currency:'EGP':('currency.EGP' | translate)+'
            ':'0.0-0'}}</span>
        </div>
      </div>
      <svg *ngIf="first || last" class="destination-flag" width="100" height="100" xmlns="http://www.w3.org/2000/svg">
        <g>
          <line id="svg_1" stroke="#2989FF" stroke-width="20" x1="90" x2="-10" y1="-10" y2="90" />
          <line id="svg_2" stroke="#2989FF" stroke-width="2" x1="63" x2="-1" y1="-1" y2="63" />
          <line id="svg_3" stroke="#2989FF" stroke-width="2" x1="66" x2="-1" y1="-1" y2="66" stroke-dasharray="5,5" />
          <line id="svg_4" stroke="#2989FF" stroke-width="2" x1="96" x2="-1" y1="-1" y2="96" stroke-dasharray="5,5" />
          <line id="svg_5" stroke="#2989FF" stroke-width="2" x1="99" x2="-1" y1="-1" y2="99" />
          <text id="svg_6" *ngIf="first" x="15" y="38" transform="rotate(-45 48,40)" font-size="12" fill="#FFF">{{'request.recommended_destinations.highest'
            | translate}}</text>
          <text id="svg_7" *ngIf="last" x="15" y="38" transform="rotate(-45 48,40)" font-size="12" fill="#FFF">{{'request.recommended_destinations.lowest'
            | translate}}</text>
        </g>
      </svg>
      <img class="destination-img" [src]="destination.image" alt="">
    </div>
  </div>
</div>

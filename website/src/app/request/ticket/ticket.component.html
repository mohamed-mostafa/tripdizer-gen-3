<div class="row h-100 justify-content-center align-items-center">
  <svg id="v-ticket" class="col-12 v-ticket d-none d-md-block" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 0 1300 550">
    <style>
      .svg-fa {
        font-family: FontAwesome;
      }

      .fill-blue {
        fill: #2989ff;
      }

      .fill-white {
        fill: #ffffff;
      }

      .splitter {
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .splitter.l-splitter {
        stroke-width: 4px;
        stroke-dasharray: 0 10.205;
      }

      .splitter.s-splitter {
        stroke-width: 3px;
        stroke-dasharray: 0 7;
      }

    </style>
    <defs>
      <filter id="left-part" filterUnits="userSpaceOnUse">
        <feOffset input="SourceAlpha" />
        <feGaussianBlur stdDeviation="25" result="d" />
        <feFlood flood-color="#2989ff" flood-opacity="0.478" />
        <feComposite operator="in" in2="d" />
        <feComposite in="SourceGraphic" />
      </filter>
      <filter id="right-part" filterUnits="userSpaceOnUse">
        <feOffset input="SourceAlpha" />
        <feGaussianBlur stdDeviation="25" result="b" />
        <feFlood flood-color="#2989ff" flood-opacity="0.478" />
        <feComposite operator="in" in2="b" />
        <feComposite in="SourceGraphic" />
      </filter>
    </defs>
    <g transform="translate(-150 -150)">
      <g filter="url(#left-part)" transform="matrix(1, 0, 0, 1, 150, 150)">
        <path class="fill-blue" d="M0,425V25A25,25,0,0,0,25,0H225a25,25,0,0,0,25,25v400A25,25,0,0,0,225,450H25A25,25,0,0,0,0,425Z"
          transform="translate(50 50)" />
      </g>
      <g filter="url(#right-part)" transform="matrix(1, 0, 0, 1, 225, 150)">
        <path class="fill-blue" d="M175,425V25A25,25,0,0,0,200,0h900a25,25,0,0,0,25,25v400a25,25,0,0,0-25,25H200A25,25,0,0,0,175,425Z"
          transform="translate(50 50)" />
      </g>
      <g transform="translate(450 250)">
        <line class="splitter l-splitter" y2="350" />
      </g>
      <g class="fill-white" transform="translate(222 238)">
        <text class="fill-white" [attr.transform]="'translate(30 ' + (35 + (6 - ticket.preferences.length) * 17.5) + ')'"
          font-size="18">
          <tspan x="0" y="0">{{ticket.departureDate | date: 'd / M / y'}}</tspan>
          <tspan x="0" y="35">{{ticket.returnDate | date: 'd / M / y'}}</tspan>
          <tspan x="0" y="70">{{ticket.adultsNumber}} adults</tspan>
          <tspan x="0" y="105">{{ticket.estimatedCost | currency:'EGP':'symbol':'0.0-0'}}</tspan>
          <tspan x="0" [attr.y]="105 + (i + 1) * 35" *ngFor="let preference of ticket.preferenceNames; index as i">{{preference}}</tspan>
        </text>
        <g class="fill-white" transform="translate(400 20)">
          <text font-size="24">
            <tspan y="30">Request No.</tspan>
            <tspan y="70">
              <tspan x="0">#</tspan>
              <tspan x="30">{{ticket.id}}</tspan>
            </tspan>
          </text>
          <g transform="translate(0 148)">
            <g transform="translate(155 0)">
              <line class="splitter s-splitter" x2="50" />
              <circle cx="105" cy="0" r="45" stroke="#fff" stroke-width="1" fill="transparent" />
              <circle cx="105" cy="0" r="40" class="fill-white" fill-opacity="0.5" />
              <circle cx="105" cy="0" r="30" class="fill-white" />
              <text class="svg-fa fill-blue" font-size="32" transform="translate(89 12)">&#xf072;</text>
              <line class="splitter s-splitter" x2="50" transform="translate(160 0)" />
            </g>
            <text y="27" font-size="84">
              <tspan x="0">{{ticket.travelingFrom | slice:0:3 | uppercase}}</tspan>
              <tspan x="380">{{ticket.destinationName | slice:0:3 | uppercase}}</tspan>
            </text>
          </g>
          <text font-size="19">
            <tspan x="0" y="250">It is a long established fact that a reader</tspan>
            <tspan x="0" y="280">will be distracted by the readable content of</tspan>
            <tspan x="0" y="310">a page when looking at its layout.</tspan>
          </text>
        </g>
      </g>
      <g transform="translate(1025 690)" display="none" class="ticket-links" font-size="16">
        <a (click)="saveAsPDF()" xlink:href="javascript:void(0)">
          <text x="0" class="fill-blue fa">&#xf1c1;</text>
          <text x="25" class="fill-blue">Save as PDF</text>
        </a>
        <a (click)="shareWithFriends()" xlink:href="javascript:void(0)">
          <text x="175" class="fill-blue fa">&#xf1e0;</text>
          <text x="200" class="fill-blue">Share with friends</text>
        </a>
      </g>
    </g>
  </svg>
  <svg id="h-ticket" class="h-100 h-ticket d-block d-md-none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
    viewBox="0 0 400 710">
    <style>
      .svg-fa {
        font-family: FontAwesome;
      }

      .fill-blue {
        fill: #2989ff;
      }

      .fill-white {
        fill: #ffffff;
      }

      .splitter {
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .splitter.l-splitter {
        stroke-width: 4px;
        stroke-dasharray: 0 10.205;
      }

      .splitter.s-splitter {
        stroke-width: 3px;
        stroke-dasharray: 0 7;
      }

    </style>
    <defs>
      <filter id="top-part" filterUnits="userSpaceOnUse">
        <feOffset input="SourceAlpha" />
        <feGaussianBlur stdDeviation="12.5" result="d" />
        <feFlood flood-color="#2989ff" flood-opacity="0.478" />
        <feComposite operator="in" in2="d" />
        <feComposite in="SourceGraphic" />
      </filter>
      <filter id="bottom-part" filterUnits="userSpaceOnUse">
        <feOffset input="SourceAlpha" />
        <feGaussianBlur stdDeviation="12.5" result="b" />
        <feFlood flood-color="#2989ff" flood-opacity="0.478" />
        <feComposite operator="in" in2="b" />
        <feComposite in="SourceGraphic" />
      </filter>
    </defs>
    <g transform="translate(-50 -50)">
      <g filter="url(#top-part)" transform="matrix(1, 0, 0, 1, 50, 50)">
        <path class="fill-blue" d="M0,175V25A25,25,0,0,0,25,0H325a25,25,0,0,0,25,25v150A25,25,0,0,0,325,200H25A25,25,0,0,0,0,175Z"
          transform="translate(25 25)" />
      </g>
      <g filter="url(#bottom-part)" transform="matrix(1, 0, 0, 1, 50, 250)">
        <path class="fill-blue" d="M0,725V25A25,25,0,0,0,25,0H325a25,25,0,0,0,25,25v410A25,25,0,0,0,325,460H25A25,25,0,0,0,0,435Z"
          transform="translate(25 25)" />
      </g>
      <g transform="translate(115 275)">
        <line class="splitter l-splitter" x2="270" />
      </g>
      <g class="fill-white" transform="translate(98 113)">
        <text class="fill-white" transform="translate(25 15)" font-size="14">
          <tspan x="0" y="0">{{ticket.departureDate | date: 'd / M / y'}}</tspan>
          <tspan x="120" y="0">{{ticket.returnDate | date: 'd / M / y'}}</tspan>
          <tspan x="0" y="35">{{ticket.adultsNumber}} adults</tspan>
          <tspan x="120" y="35">{{ticket.estimatedCost | currency:'EGP':'symbol':'0.0-0'}}</tspan>
          <tspan [attr.x]="(i > 2 ? i - 3 : i) * 80" [attr.y]="70 + (i > 2 ? 35 : 0)" *ngFor="let preference of ticket.preferenceNames; index as i">{{preference}}</tspan>
        </text>
        <g class="fill-white" transform="translate(10 175)">
          <text font-size="16">
            <tspan y="30">Request No.</tspan>
            <tspan y="60">
              <tspan x="0">#</tspan>
              <tspan x="15">{{ticket.id}}</tspan>
            </tspan>
          </text>
          <g transform="translate(0 110)">
            <g transform="translate(140 15)">
              <line class="splitter s-splitter" y2="20" />
              <circle cx="0" cy="60" r="27.5" stroke="#fff" stroke-width="0.5" fill="transparent" />
              <circle cx="0" cy="60" r="25" class="fill-white" fill-opacity="0.5" />
              <circle cx="0" cy="60" r="20" class="fill-white" />
              <text class="svg-fa fill-blue" font-size="24" text-anchor="middle" transform="translate(2.5 67.5)">&#xf072;</text>
              <line class="splitter s-splitter" y2="20" transform="translate(0 100)" />
            </g>
            <text text-anchor="middle" x="140" font-size="36">
              <tspan y="0">{{ticket.travelingFrom | slice:0:3 | uppercase}}</tspan>
              <tspan x="140" y="175">{{ticket.destinationName | slice:0:3 | uppercase}}</tspan>
            </text>
          </g>
          <text font-size="12">
            <tspan x="0" y="325">It is a long established fact that</tspan>
            <tspan x="0" y="350">a reader will be distracted by the</tspan>
            <tspan x="0" y="375">readable content of a page when</tspan>
            <tspan x="0" y="400">looking at its layout.</tspan>
          </text>
        </g>
      </g>
    </g>
  </svg>
</div>

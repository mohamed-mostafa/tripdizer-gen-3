<c-request-form-layout [formGroup]="formGroup" [isBackHidden]="true" (next)="save()">
	<mat-form-field class="form-control-xl">
		<mat-hint>{{ formGroup.controls['travelingFrom'].errors | errorMessage }}</mat-hint>
		<mat-error>{{ formGroup.controls['travelingFrom'].errors | errorMessage }}</mat-error>
		<mat-select
			formControlName="travelingFrom"
			[placeholder]="'request.traveling_from.traveling_from' | translate"
			[compareWith]="compareObjects"
			class="text-yellow text-uppercase font-weight-bold"
		>
			<mat-option *ngFor="let airport of ('request.traveling_from.airports' | translate)" [value]="airport">{{
				airport.name
			}}</mat-option>
		</mat-select>
	</mat-form-field>
</c-request-form-layout>

<c-request-form-layout [formGroup]="formGroup" [nextStepPath]="nextStepPath" [prevStepPath]="prevStepPath" (next)="save()"
  [isBackHidden]="true">
  <mat-form-field class="form-control-xl my-1 my-sm-2 my-md-3 my-lg-4">
    <mat-hint>{{formGroup.controls.travelingFrom.errors | errorMessage}}</mat-hint>
    <mat-error>{{formGroup.controls.travelingFrom.errors | errorMessage}}</mat-error>
    <input matInput type="text" id="traveling-from" class="custom-bs text-yellow text-uppercase font-weight-bold"
      placeholder="Traveling From" formControlName="travelingFrom">
  </mat-form-field>
</c-request-form-layout>

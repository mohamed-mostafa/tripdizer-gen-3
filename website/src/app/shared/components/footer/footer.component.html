<div
	class="row px-sm-5 py-sm-4 px-4 py-3 footer text-center text-md-left"
	[class.title-font]="('dir' | translate) !== 'rtl'"
	[class.text-md-left]="('dir' | translate) !== 'rtl'"
	[class.text-md-right]="('dir' | translate) === 'rtl'"
>
	<div class="col-12 col-md-6 col-lg-3 mx-auto row">
		<a [routerLink]="['/']" class="col-12 mb-3 mb-md-1 mt-3 px-0 brand d-inline-block">
			<img [src]="'core.footer.logo' | translate" width="178" height="51.68" alt="" />
		</a>
		<p class="col-12 slogan">{{ 'core.footer.slogan' | translate }}</p>
	</div>
	<div class="d-none d-lg-inline-block col-lg-6"></div>
	<ul class="contact-info pt-4 col-12 col-md-6 col-lg-3">
		<li class="py-1">
			<span dir="ltr">+2 0101 907 5876</span>
			<br />
			<span dir="ltr">bookings@tripdizer.com</span>
			<br />
			<span>{{ 'core.footer.location' | translate }}</span>
		</li>
		<li class="py-1 py-xl-2 mt-2 footer-li-btn" *ngIf="isPlanTripBtnHidden">
			<a [routerLink]="['/', 'request']" class="btn custom-bs btn-rounded px-5 font-weight-bold font-italic">{{
				'core.footer.plan_trip' | translate
			}}</a>
		</li>
	</ul>
</div>

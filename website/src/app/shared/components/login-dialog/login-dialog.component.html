<span [dir]="'dir' | translate" [ngClass]="{ 'text-right rtl': ('dir' | translate) === 'rtl' }">
	<span mat-dialog-title>
		{{ 'shared.login_dialog.sign_in' | translate }}
		<img
			src="https://d30y9cdsu7xlg0.cloudfront.net/png/53504-200.png"
			(click)="close()"
			class="close-btn"
			[ngClass]="('dir' | translate) === 'rtl' ? 'float-left mr-5' : 'float-right ml-5'"
		/>
	</span>
	<h6>{{ 'shared.login_dialog.improve_experience' | translate }}</h6>
	<div mat-dialog-content>
		<div class="text-center" *ngIf="isAuthenticated; else notUser">
			<c-core-user-profile></c-core-user-profile>
		</div>
		<ng-template #notUser>
			<div class="text-center">
				<button class="btn mx-1 social-btn google-btn" [disabled]="authLoading | async" (click)="signInWithGoogle()">
					<span *ngIf="authLoading | async" class="fa fa-spinner float-left m-1"></span>
					<span *ngIf="!(authLoading | async)" class="fa fa-google float-left m-1"></span>
					<div>{{ 'shared.login_dialog.sign_in_google' | translate }}</div>
				</button>
				<button
					class="btn mx-1 social-btn facebook-btn"
					[disabled]="authLoading | async"
					(click)="signInWithFacebook()"
				>
					<span *ngIf="authLoading | async" class="fa fa-spinner float-left m-1"></span>
					<span *ngIf="!(authLoading | async)" class="fa fa-facebook float-left m-1"></span>
					<div>{{ 'shared.login_dialog.sign_in_facebook' | translate }}</div>
				</button>
				<div class="my-2  text-center">{{ 'shared.login_dialog.or' | translate }}</div>
				<button
					class="btn mx-1 social-btn btn-secondary"
					[disabled]="authLoading | async"
					(click)="continueWithoutLogin()"
				>
					{{ 'shared.login_dialog.continue_without_login' | translate }}
				</button>
			</div>
		</ng-template>
	</div>
	<h6 *ngIf="!isAuthenticated" class="text-danger">{{ authErrorMsg | async }}</h6>
</span>

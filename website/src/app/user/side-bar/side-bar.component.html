<div class="side-bar mx-auto py-4 mb-4">
	<div class="user-avatar mx-auto p-3 mb-3">
		<img [src]="user?.picture" alt="" />
	</div>

	<div class="text-center mb-4">
		<h5 class="title-font text-blue">{{ user?.firstName }} {{ user?.lastName }}</h5>
	</div>

	<mat-list class="side-menu" role="list">
		<mat-list-item
			routerLink="/user"
			role="listitem"
			routerLinkActive="active-item"
			class="font-weight-bold list-item"
			[routerLinkActiveOptions]="{ exact: true }"
			><i class="fa fa-user mr-3"></i> {{ 'user.side_bar.my_profile' | translate }}</mat-list-item
		>
		<!-- TODO -> Hidden till know my plan page purpose -->
		<!-- <mat-list-item
			routerLinkActive="active-item"
			routerLink="/user/plans"
			role="listitem"
			class="font-weight-bold list-item"
			><i class="fa fa-paper-plane mr-3"></i>
			{{ 'user.side_bar.my_plans' | translate }}
		</mat-list-item> -->
		<mat-list-item
			routerLinkActive="active-item"
			role="listitem"
			routerLink="/user/bookings"
			class="font-weight-bold list-item"
			><i class="fa fa-bookmark mr-3"></i>
			{{ 'user.side_bar.my_booking' | translate }}
		</mat-list-item>
		<mat-list-item routerLinkActive="active-item" (click)="logOut()" role="listitem" class="font-weight-bold list-item"
			><i class="fa fa-sign-out mr-3"></i>
			{{ 'user.side_bar.log_out' | translate }}
		</mat-list-item>
	</mat-list>
</div>

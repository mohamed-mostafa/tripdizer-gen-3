<div class="py-5">
	<h3 class="title-font page-title text-blue mb-5">
		<i class="fa fa-user mr-3"></i>
		<span class="font-weight-bold">{{ 'user.user_info.my_profile' | translate }}</span>
	</h3>

	<form class="example row">
		<mat-form-field class="form-input col-lg-6 mb-2">
			<input
				matInput
				[placeholder]="'user.user_info.first_name' | translate"
				[(ngModel)]="user.firstName"
				name="firstName"
				value="{{ user.firstName }}"
				disabled
			/>
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2">
			<input
				matInput
				[placeholder]="'user.user_info.last_name' | translate"
				[(ngModel)]="user.lastName"
				name="lastName"
				value="{{ user.lastName }}"
				disabled
			/>
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2">
			<input
				matInput
				[placeholder]="'user.user_info.email' | translate"
				[(ngModel)]="user.email"
				name="email"
				value="{{ user.email }}"
				disabled
			/>
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2">
			<input
				type="number"
				matInput
				[placeholder]="'user.user_info.mobile' | translate"
				[(ngModel)]="user.phone"
				name="phone"
				value="{{ user.phone }}"
				[disabled]="show"
			/>
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2">
			<mat-label>Choose a date</mat-label>
			<input matInput [matDatepicker]="picker" [(ngModel)]="user.birthday" name="birthday" [disabled]="show" />
			<mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
			<mat-datepicker #picker></mat-datepicker>
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2">
			<input
				matInput
				[placeholder]="'user.user_info.location' | translate"
				[(ngModel)]="user.location"
				name="location"
				value="{{ user.location }}"
				[disabled]="show"
			/>
		</mat-form-field>
	</form>

	<button class="btn btn-primary custom-bs btn-rounded px-4 py-2 mt-3" [disabled]="show" (click)="save(user)">
		<i class="fa fa-spinner fa-spin" *ngIf="show"></i> Save changes
	</button>
</div>

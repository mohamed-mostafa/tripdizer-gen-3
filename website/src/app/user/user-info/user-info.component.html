<div class="py-5">
	<h3 class="title-font page-title text-blue mb-5">
		<i class="fa fa-user mr-3"></i>
		<span class="font-weight-bold">{{ 'user.user_info.my_profile' | translate }}</span>
	</h3>

	<form class="example row">
		<mat-form-field class="form-input col-lg-6 mb-2">
			<input matInput [placeholder]="'user.user_info.first_name' | translate" value="{{ user.firstName }}" disabled />
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2">
			<input matInput [placeholder]="'user.user_info.last_name' | translate" value="{{ user.lastName }}" disabled />
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2 disabled-field">
			<input matInput [placeholder]="'user.user_info.email' | translate" value="{{ user.email }}" disabled />
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2">
			<input matInput [placeholder]="'user.user_info.mobile' | translate" value="{{ user.phone }}" />
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2">
			<input matInput [placeholder]="'user.user_info.birth_date' | translate" value="{{ user.birthday }}" />
		</mat-form-field>

		<mat-form-field class="form-input col-lg-6 mb-2">
			<input matInput [placeholder]="'user.user_info.location' | translate" value="{{ user.location }}" />
		</mat-form-field>
	</form>

	<button class="btn btn-primary custom-bs btn-rounded px-4 py-2 mt-3">Save changes</button>
</div>

<div class="py-5">
	<h3 class="title-font page-title text-blue mb-5">
		<i class="fa fa-paper-plane mr-3"></i
		><span class="font-weight-bold">{{ 'user.user_plans.my_plans' | translate }}</span>
	</h3>

	<div class="row">
		<div *ngFor="let plan of (userPlans | async)" class="col-lg-6 text-center mb-5">
			<div
				class="town-item mx-auto"
				(click)="openDetails('plan_details')"
				[ngStyle]="{ 'background-image': 'url(' + plan.image + ')'}"
			>
				<div class="dark-container">
					<div class="town-text title-font">
						<p class="mb-0">{{ plan.days_count }} {{ 'user.user_plans.days_in' | translate }}</p>
						<h3 class="mb-0 font-weight-bold">{{ plan.country_name }}</h3>
						<p class="mb-0">
							{{ 'user.user_plans.from' | translate }} {{ plan.from }} {{ 'user.user_plans.to' | translate }}
							{{ plan.to }}
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
